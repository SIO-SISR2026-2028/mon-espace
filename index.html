<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIO 26-28">
<meta name="format-detection" content="telephone=no">
<title>SIO 2026-2028</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#7c5cff;--accent2:color-mix(in srgb,var(--accent) 55%,#ff6ad5);--soft:color-mix(in srgb,var(--accent) 14%,transparent);--r:16px;--ease:cubic-bezier(.2,.8,.2,1);--side:250px;font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif}
[data-theme=dark]{--bg:#0b0b12;--bg2:#13131d;--panel:rgba(255,255,255,.04);--panel-2:rgba(255,255,255,.07);--input:rgba(255,255,255,.05);--glass:rgba(12,12,20,.55);--line:rgba(255,255,255,.08);--text:#ececf3;--muted:#8d8da6;--shadow:0 12px 40px rgba(0,0,0,.45);color-scheme:dark}
[data-theme=light]{--bg:#f3f3f9;--bg2:#ffffff;--panel:rgba(255,255,255,.72);--panel-2:#ffffff;--input:#f2f2f8;--glass:rgba(255,255,255,.6);--line:rgba(20,20,60,.09);--text:#1b1b2f;--muted:#6c6c86;--shadow:0 12px 32px rgba(40,40,90,.08);color-scheme:light}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;font-size:15px;transition:background .4s,color .4s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--accent);cursor:pointer;text-decoration:none}
.ic{flex:none;display:block}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid transparent;background-clip:padding-box}

/* Fond animé */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.32;animation:float 22s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--accent);top:-16vmax;left:-12vmax}
.bg i:nth-child(2){background:#ff6ad5;bottom:-22vmax;right:-12vmax;animation-delay:-7s;animation-duration:27s}
.bg i:nth-child(3){background:#4cc9f0;top:35%;left:40%;width:28vmax;height:28vmax;opacity:.16;animation-duration:31s}
[data-theme=light] .bg i{opacity:.2}
@keyframes float{to{transform:translate(9vmax,6vmax) scale(1.15)}}
[data-bg=mesh] .bg i{animation:none}
[data-bg=grid] .bg i{display:none}
[data-bg=grid] .bg{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:34px 34px;-webkit-mask-image:radial-gradient(circle at 50% 25%,#000,transparent 75%);mask-image:radial-gradient(circle at 50% 25%,#000,transparent 75%)}
[data-bg=plain] .bg{display:none}
.noanim *,.noanim *::before,.noanim *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Structure */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh;transition:grid-template-columns .35s var(--ease)}
.compact{--side:82px}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);z-index:40}
.logo{display:flex;align-items:center;gap:12px;padding:6px 10px 24px;font-weight:800;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.logo svg{flex:none;filter:drop-shadow(0 6px 16px color-mix(in srgb,var(--accent) 55%,transparent));transition:transform .4s var(--ease)}
.logo:hover svg{transform:rotate(-8deg) scale(1.08)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:calc(var(--r) - 4px);color:var(--muted);font-weight:600;transition:.25s var(--ease);white-space:nowrap}
.nav a:hover{color:var(--text);background:var(--panel-2)}
.nav a.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 26px -10px var(--accent)}
.nav a.on .ic{animation:bounce .5s var(--ease)}
@keyframes bounce{40%{transform:scale(1.25) rotate(-8deg)}}
.compact .nav a span,.compact .logo span:last-child,.compact .side-foot .lbl{display:none}
.compact .nav a,.compact .logo{justify-content:center;padding-left:0;padding-right:0}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-foot .btn{justify-content:center}
main{min-width:0;padding:22px clamp(16px,3vw,38px) 70px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.03em}
.sync{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;cursor:default}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.st-ok b{background:#3ddc97;box-shadow:0 0 0 4px rgba(61,220,151,.15)}
.sync.st-sync b,.sync.st-pending b{background:#ffd166;animation:pulse 1s infinite}
.sync.st-err b{background:#ff5d6c;box-shadow:0 0 0 4px rgba(255,93,108,.15)}
@keyframes pulse{50%{opacity:.3}}
.sbtn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--muted);min-width:220px;transition:.2s}
.sbtn:hover{border-color:var(--accent);color:var(--text)}
.sbtn kbd{margin-left:auto;font:600 11px inherit;padding:2px 7px;border-radius:6px;border:1px solid var(--line)}
#view.enter{animation:viewIn .5s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}}

/* Composants */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow)}
.card h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.mt{margin-top:18px}
.row{display:flex;align-items:center}.gap{gap:10px}.wrap{flex-wrap:wrap}.end{justify-content:flex-end}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;font-weight:700;color:var(--accent)}
.link{font-size:13px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);font-weight:600;font-size:14px;transition:.2s var(--ease);white-space:nowrap}
.btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 10px 24px -12px var(--accent)}
.btn.primary:hover{box-shadow:0 14px 30px -10px var(--accent)}
.btn.danger{color:#ff5d6c}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.5;pointer-events:none}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:var(--panel-2);border:1px solid var(--line);transition:.2s var(--ease);flex:none}
.icon-btn:hover{color:var(--accent);transform:translateY(-1px)}
.icon-btn.on,.icon-btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.input{width:100%;padding:11px 14px;border-radius:12px;background:var(--input);border:1px solid var(--line);outline:none;transition:.2s;resize:vertical;color:var(--text)}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.input.lg{font-size:18px;font-weight:700}
.input.sm{padding:8px 12px;font-size:13px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.search{flex-direction:row;align-items:center;gap:8px;padding:0 12px;border-radius:12px;background:var(--input);border:1px solid var(--line);color:var(--muted);transition:.2s}
.search input{border:0;background:none;outline:none;padding:10px 0;width:100%;color:var(--text);min-width:120px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--input);border:1px solid var(--line);gap:2px}
.seg button{padding:7px 12px;border-radius:9px;color:var(--muted);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;transition:.2s}
.seg button.on{background:var(--panel-2);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.seg.full{display:flex}.seg.full button{flex:1;justify-content:center}
.dots{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;background:var(--c);transition:.2s var(--ease);box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.dot:hover{transform:scale(1.15)}
.dot.on{box-shadow:0 0 0 3px var(--bg2),0 0 0 5px var(--c)}
.cpick{width:32px;height:32px;border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.switch{flex-direction:row;align-items:center;gap:12px;cursor:pointer;color:var(--text);font-size:14px}
.switch input{display:none}
.switch span{width:44px;height:25px;border-radius:20px;background:var(--line);position:relative;transition:.25s;flex:none}
.switch span::after{content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.3s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(19px)}
input[type=range]{accent-color:var(--accent);width:100%}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 10px;color:var(--muted);text-align:center;font-size:14px}
.empty .ic{opacity:.45}
.hidden{display:none!important}

/* Accueil */
.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:30px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 100% 0,var(--soft),transparent 60%);pointer-events:none}
.hero h1{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.03em;margin:6px 0}
.hero .row.gap{margin-top:20px;flex-wrap:wrap}
.clock{position:relative;width:150px;height:150px;flex:none;display:grid;place-items:center;text-align:center}
.clock svg{position:absolute;inset:0;transform:rotate(-90deg)}
.clock circle{fill:none;stroke-width:6}
.clock .tr{stroke:var(--line)}
.clock .pr{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.clock b{font-size:32px;font-weight:800;letter-spacing:-.03em;display:block}
.clock small{color:var(--muted);font-size:12px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:18px 0}
.stat{display:flex;gap:14px;align-items:center;cursor:pointer;transition:.3s var(--ease);animation:pop .5s var(--ease) both;animation-delay:var(--d)}
.stat:hover{transform:translateY(-4px)}
.stat .si{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--soft);color:var(--accent);flex:none}
.stat b{font-size:22px;font-weight:800;display:block;letter-spacing:-.02em}
.stat small{color:var(--muted);font-size:12.5px}
.stat p{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.ev-row{display:flex;align-items:center;gap:12px;padding:11px;border-radius:12px;cursor:pointer;transition:.2s}
.ev-row:hover{background:var(--panel-2);transform:translateX(3px)}
.ev-dot{width:6px;height:36px;border-radius:6px;background:var(--c);flex:none}
.ev-row b{display:block;font-size:14px}.ev-row small{color:var(--muted);font-size:12.5px}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);white-space:nowrap}
.mini-notes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-notes .note{margin:0;padding:14px}
.mini-notes .note .md{max-height:80px}

/* Fichiers */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;margin-bottom:16px}
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-weight:600;min-width:0}
.crumbs a{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;color:var(--text);transition:.2s}
.crumbs a:hover{background:var(--panel-2)}
.crumbs a:last-child{color:var(--accent)}
.crumbs span{color:var(--muted);display:flex}
.hint{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);font-size:13.5px;margin-bottom:16px}
.files-wrap{position:relative;min-height:280px}
.files.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.files.list{display:flex;flex-direction:column;gap:6px}
.files .empty{grid-column:1/-1}
.fc{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:.25s var(--ease);animation:pop .45s var(--ease) both;animation-delay:var(--d);min-width:0}
.fc:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:var(--shadow)}
.fc.hl{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.fi{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:var(--fc,var(--accent));background:color-mix(in srgb,var(--fc,var(--accent)) 15%,transparent);margin-bottom:14px;flex:none;transition:.3s var(--ease)}
.fc:hover .fi{transform:scale(1.07) rotate(-4deg)}
.fi.dir{--fc:#ffb547}.fi.pdf{--fc:#ff5d6c}.fi.img{--fc:#3ddc97}.fi.zip{--fc:#e8b931}.fi.doc{--fc:#4c8dff}.fi.sheet{--fc:#2ecc71}.fi.slide{--fc:#ff8a4c}.fi.vid{--fc:#ff6ad5}.fi.aud{--fc:#b388ff}.fi.code{--fc:#4cc9f0}.fi.txt{--fc:#a0a0b8}.fi.other{--fc:#8d8da6}
.emo{font-size:26px;line-height:1}
.fn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fn small{color:var(--muted);font-size:12px}
.fa{position:absolute;top:10px;right:10px;display:flex;gap:4px;opacity:0;transform:translateY(-4px);transition:.2s}
.fc:hover .fa{opacity:1;transform:none}
.fa button{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--line);color:var(--muted);transition:.2s}
.fa button:hover{color:var(--accent);transform:scale(1.08)}.fa button.danger:hover{color:#ff5d6c}
.files.list .fc{display:flex;align-items:center;gap:14px;padding:10px 14px}
.files.list .fi{width:40px;height:40px;margin:0;border-radius:11px}
.files.list .fn{flex:1;min-width:0}
.files.list .fa{position:static;opacity:1;transform:none}
@media (hover:none){.fa{opacity:1;transform:none}}
.drop-ov{position:absolute;inset:-6px;border:2px dashed var(--accent);border-radius:calc(var(--r) + 4px);background:color-mix(in srgb,var(--bg) 75%,var(--accent) 10%);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--accent);opacity:0;pointer-events:none;transition:.2s;z-index:5;min-height:240px;font-size:15px}
.drag .drop-ov{opacity:1}
.drag .drop-ov .ic{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.sk{height:132px;border-radius:var(--r);background:linear-gradient(90deg,var(--panel),var(--panel-2),var(--panel));background-size:200% 100%;animation:sh 1.2s infinite}
.files.list .sk{height:60px}
@keyframes sh{to{background-position:-200% 0}}
.errbox{grid-column:1/-1;padding:18px;border-radius:12px;background:rgba(255,93,108,.1);color:#ff5d6c;font-weight:600;font-size:14px}

/* Notes */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:7px 14px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);transition:.2s}
.chip:hover{color:var(--text)}
.chip.on{background:var(--accent);color:#fff;border-color:transparent}
.notes-grid{columns:270px;column-gap:16px}
.notes-grid .empty{column-span:all}
.note{break-inside:avoid;margin-bottom:16px;padding:18px 18px 16px 22px;border-radius:var(--r);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 15%,var(--bg2)),var(--bg2));border:1px solid color-mix(in srgb,var(--c) 28%,var(--line));cursor:pointer;position:relative;transition:.3s var(--ease);animation:pop .45s var(--ease) both;animation-delay:var(--d);display:block}
.note:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:var(--shadow)}
.note::before{content:'';position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.note h4{font-size:16px;margin-bottom:8px;padding-right:20px;letter-spacing:-.01em}
.note .md{font-size:13.5px;color:var(--muted);max-height:220px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent);line-height:1.55}
.note footer{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;font-size:12px;align-items:center}
.note footer span{color:var(--c);font-weight:700}
.note footer time{margin-left:auto;color:var(--muted)}
.pinned{position:absolute;top:14px;right:14px;color:var(--c)}
.md h2,.md h3,.md h4{color:var(--text);margin:6px 0 4px;letter-spacing:-.01em}
.md ul{padding-left:20px;margin:4px 0}
.md code{background:var(--panel-2);padding:1px 6px;border-radius:6px;font-size:.9em;font-family:ui-monospace,monospace}
.md mark{background:color-mix(in srgb,#ffd166 45%,transparent);color:inherit;padding:0 3px;border-radius:4px}
.md a{word-break:break-all}
.ck{display:flex;align-items:center;gap:8px}.ck i{width:14px;height:14px;border-radius:4px;border:2px solid var(--muted);flex:none}
.ck.on{opacity:.6;text-decoration:line-through}.ck.on .ic{color:#3ddc97}
.ne{display:flex;flex-direction:column;gap:12px;height:min(78vh,740px)}
.ne-top{display:flex;gap:8px;align-items:center}
.ne-title{flex:1;font-size:24px;font-weight:800;background:none;border:0;outline:none;letter-spacing:-.02em;min-width:0;color:var(--text)}
.ne-bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mdbar{display:flex;gap:4px;flex-wrap:wrap}
.mdbar button{padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);transition:.15s}
.mdbar button:hover{color:var(--accent);border-color:var(--accent)}
.ne-body{flex:1;width:100%;resize:none;border:1px solid var(--line);border-radius:14px;background:var(--input);padding:16px;outline:none;font-size:15px;line-height:1.7;overflow:auto;color:var(--text);transition:border-color .2s}
.ne-body:focus{border-color:color-mix(in srgb,var(--c) 70%,var(--line))}
.ne-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ne-foot .input{flex:1;min-width:180px;width:auto}
.ne .dot{width:22px;height:22px}

/* Agenda */
.cal-wrap{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
.cal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.cal-h h2{font-size:24px;font-weight:800;text-transform:capitalize;letter-spacing:-.02em}
.cal-dow{display:grid;grid-template-columns:44px repeat(7,1fr);gap:6px;margin-bottom:6px}

const GH={
  cfg(){let c={};try{c=JSON.parse(localStorage.getItem('orga_gh'))||{}}catch{}if(!c.owner&&EMBED.owner)c={owner:EMBED.owner,repo:EMBED.repo,branch:EMBED.branch||'',base:EMBED.base||''};return c},
  on(){const c=this.cfg();return!!(c.owner&&c.repo&&c.token)},

  full(p){const b=(this.cfg().base||'').replace(/^\/+|\/+$/g,'');return join(b,p)},
  async req(path,opt={},raw=false){

  },
  async list(dir){try{const d=await this.req(`/contents/${this.enc(this.full(dir))}?ref=${encodeURIComponent(this.branch())}`);return Array.isArray(d)?d:[]}catch(e){if(e.status===404)return[];throw e}},
  async sha(fp){try{const d=await this.req(`/contents/${this.enc(fp)}?ref=${encodeURIComponent(this.branch())}`);return Array.isArray(d)?null:d.sha}catch(e){if(e.status===404)return null;throw e}},
  async put(fp,b64,msg){

    const sha=await this.sha(fp);if(sha)body.sha=sha;
    try{return await this.req(`/contents/${this.enc(fp)}`,{method:'PUT',body:JSON.stringify(body)})}

  },
  del(fp,sha){return this.req(`/contents/${this.enc(fp)}`,{method:'DELETE',body:JSON.stringify({message:'Suppression '+fp,sha,branch:this.branch()})})},

};

/* ============ Stockage local de secours (IndexedDB) ============ */
const IDB={
  db:null,
  open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open('orga_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'path'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('f',mode);const q=fn(t.objectStore('f'));t.oncomplete=()=>res(q?q.result:undefined);t.onerror=()=>rej(t.error)})},
  all(){return this.run('readonly',s=>s.getAll())},
  get(p){return this.run('readonly',s=>s.get(p))},
  put(r){return this.run('readwrite',s=>s.put(r))},
  del(p){return this.run('readwrite',s=>s.delete(p))}
};

/* ============ Système de fichiers unifié ============ */
const hiddenName=n=>n.startsWith('.');
const FS={
  remote(){return GH.on()},
  async list(dir){
    if(this.remote()){const d=await GH.list(dir);return d.filter(x=>!hiddenName(x.name)).map(x=>({name:x.name,path:join(dir,x.name),type:x.type==='dir'?'dir':'file',size:x.size||0,sha:x.sha}))}
    const all=await IDB.all(),pre=dir?dir+'/':'',map=new Map();
    for(const r of all){if(!r.path.startsWith(pre)||r.path===dir)continue;const rest=r.path.slice(pre.length),i=rest.indexOf('/');
      if(i===-1)map.set(rest,{name:rest,path:r.path,type:r.type,size:r.size||0});
      else{const n=rest.slice(0,i);if(!map.has(n))map.set(n,{name:n,path:pre+n,type:'dir',size:0})}}
    return[...map.values()];
  },
  async ensureDirs(path){const parts=path.split('/');parts.pop();let cur='';for(const p of parts){cur=join(cur,p);await IDB.put({path:cur,type:'dir',mtime:Date.now()})}},
  async mkdir(path){if(this.remote())return GH.put(GH.full(path+'/.keep'),'a2VlcA==','Création du dossier '+path);await this.ensureDirs(path+'/x');},
  async write(path,blob){if(this.remote())return GH.put(GH.full(path),await toB64(blob),'Ajout de '+path);await this.ensureDirs(path);return IDB.put({path,type:'file',blob,size:blob.size,mtime:Date.now()})},
  async read(path){if(this.remote())return GH.req(`/contents/${GH.enc(GH.full(path))}?ref=${encodeURIComponent(GH.branch())}`,{},true);const r=await IDB.get(path);if(!r||!r.blob)throw new Error('Fichier introuvable');return r.blob},
  async remove(x,onStep){
    if(this.remote()){
      if(x.type==='file')return GH.del(GH.full(x.path),x.sha||await GH.sha(GH.full(x.path)));
      const pre=GH.full(x.path)+'/';const blobs=(await GH.tree()).filter(t=>t.type==='blob'&&t.path.startsWith(pre));
      for(let i=0;i<blobs.length;i++){onStep&&onStep(i,blobs.length,blobs[i].path.split('/').pop());await GH.del(blobs[i].path,blobs[i].sha)}
      return;
    }
    if(x.type==='file')return IDB.del(x.path);
    const all=await IDB.all();for(const r of all)if(r.path===x.path||r.path.startsWith(x.path+'/'))await IDB.del(r.path);
  },
  async rename(x,newName){const blob=await this.read(x.path);await this.write(join(parentOf(x.path),newName),blob);await this.remove(x)},
  async stats(){
    if(this.remote()){const b=(GH.cfg().base||'').replace(/^\/+|\/+$/g,'');const pre=b?b+'/':'';const t=(await GH.tree()).filter(x=>x.type==='blob'&&x.path.startsWith(pre)&&!x.path.slice(pre.length).split('/').some(hiddenName));return{count:t.length,size:t.reduce((a,x)=>a+(x.size||0),0)}}
    const all=(await IDB.all()).filter(r=>r.type==='file');return{count:all.length,size:all.reduce((a,r)=>a+(r.size||0),0)};
  }
};

/* ============ Synchronisation des données sur GitHub ============ */
const Sync={
  t:null,sha:null,busy:false,again:false,dirty:false,
  path:'.organizer/data.json',
  schedule(){if(!GH.on())return;this.dirty=true;clearTimeout(this.t);setStatus('pending');this.t=setTimeout(()=>this.push(),2500)},
  async pull(force){
    if(!GH.on()){setStatus('local');return}
    if(!force&&(this.dirty||$('.modal-wrap'))){setStatus(this.dirty?'pending':'ok');return}
    setStatus('sync');
    try{
      const d=await GH.req(`/contents/${GH.enc(this.path)}?ref=${encodeURIComponent(GH.branch())}`);
      this.sha=d.sha;
      const txt=d.content?b64dec(d.content):await(await GH.req(`/contents/${GH.enc(this.path)}?ref=${encodeURIComponent(GH.branch())}`,{},true)).text();
      const remote=JSON.parse(txt);
      if((remote.updatedAt||0)>(S.updatedAt||0)){S=merge(remote);persistLocal();applySettings();render(false);setStatus('ok')}
      else if((remote.updatedAt||0)<(S.updatedAt||0))this.push();
      else setStatus('ok');
    }catch(e){if(e.status===404){this.sha=null;this.push()}else setStatus('err',e)}
  },
  async push(){
    if(!GH.on())return;
    if(this.busy){this.again=true;return}
    this.busy=true;this.dirty=false;setStatus('sync');
    const body={message:'Mise à jour des notes et de l’agenda',content:b64enc(JSON.stringify(S)),branch:GH.branch()};
    try{
      if(this.sha)body.sha=this.sha;
      let r;
      try{r=await GH.req(`/contents/${GH.enc(this.path)}`,{method:'PUT',body:JSON.stringify(body)})}
      catch(e){if(e.status===409||e.status===422){const s=await GH.sha(this.path);if(s)body.sha=s;else delete body.sha;r=await GH.req(`/contents/${GH.enc(this.path)}`,{method:'PUT',body:JSON.stringify(body)})}else throw e}
      this.sha=r.content.sha;setStatus('ok');
    }catch(e){this.dirty=true;setStatus('err',e)}
    this.busy=false;
    if(this.again){this.again=false;this.push()}
  }
};
function setStatus(st,e){const el=$('#sync');if(!el)return;if(!GH.on())st='local';const m={local:'Local',ok:'Synchronisé',sync:'Synchronisation…',pending:'Modifié',err:'Erreur de synchro'};el.className='sync st-'+st;el.querySelector('span').textContent=m[st];el.title=st==='err'?errMsg(e):st==='local'?'Données enregistrées dans ce navigateur':'Sauvegardé sur GitHub'}

async function loadFiles(){const p=route.path;try{const items=await FS.list(p);if(route.view!=='files'||route.path!==p)return;FILES.items=items.sort((a,b)=>a.type===b.type?a.name.localeCompare(b.name,'fr',{numeric:true}):a.type==='dir'?-1:1);drawFiles()}catch(e){const f=$('#flist');if(f)f.innerHTML=errBox(e)}}
function drawFiles(){const el=$('#flist');if(!el)return;const q=FILES.q.toLowerCase(),it=FILES.items.filter(x=>x.name.toLowerCase().includes(q));el.className='files '+S.settings.view;el.innerHTML=it.length?it.map(fileCard).join(''):empty('folder',q?'Aucun résultat':'Ce dossier est vide — dépose des fichiers ici ou clique sur « Importer »')}
async function entriesFromDrop(dt){
  const roots=[...(dt.items||[])].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  const files=[...dt.files];
  if(!roots.length)return files.map(f=>({file:f,rel:f.name}));
  const out=[];
  const walk=async(en,pre)=>{if(en.isFile){const f=await new Promise((res,rej)=>en.file(res,rej));out.push({file:f,rel:pre+f.name})}else if(en.isDirectory){const rd=en.createReader();let b;do{b=await new Promise((res,rej)=>rd.readEntries(res,rej));for(const x of b)await walk(x,pre+en.name+'/')}while(b.length)}};
  for(const r of roots)await walk(r,'');
  return out;
}

async function uploadAll(list,dest){
  list=list.filter(x=>!x.rel.split('/').some(hiddenName)||x.rel.endsWith('.zip'));
  if(!list.length)return;
  UP.open(list.length);let ok=0,fail=0;
  for(let i=0;i<list.length;i++){
    const{file,rel}=list[i];UP.step(i,list.length,rel);
    if(FS.remote()&&file.size>95*1024*1024){fail++;toast(`« ${file.name} » dépasse 100 Mo, la limite de GitHub par fichier`,'err');continue}
    try{await FS.write(join(dest,rel),file);ok++}catch(e){fail++;toast(`Échec pour ${file.name} : ${errMsg(e)}`,'err')}
  }
  UP.done(`${ok} fichier${ok>1?'s':''} importé${ok>1?'s':''}${fail?` · ${fail} échec${fail>1?'s':''}`:''}`);
  if(ok)toast(`${ok} fichier${ok>1?'s':''} importé${ok>1?'s':''}`);
  if(route.view==='files')loadFiles();
}
let zipP;function needZip(){return zipP||(zipP=new Promise((res,rej)=>{if(window.JSZip)return res();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=res;s.onerror=()=>{zipP=null;rej(new Error('Impossible de charger le module ZIP (connexion ?)'))};document.head.appendChild(s)}))}
async function unzip(x){

    const ents=[];z.forEach((rel,e)=>{if(!e.dir&&!rel.startsWith('__MACOSX/')&&!rel.split('/').some(hiddenName))ents.push(e)});
    if(!ents.length)return toast('Cette archive est vide','err');
    const base=x.name.replace(/\.zip$/i,'');
    if(!await confirmBox(`Extraire ${ents.length} fichier${ents.length>1?'s':''} ?`,`Ils seront placés dans le dossier « ${base} ».`,'Extraire'))return;
    const list=[];for(const e of ents)list.push({file:new File([await e.async('blob')],e.name.split('/').pop()),rel:e.name});
    uploadAll(list,join(parentOf(x.path),base));
  }catch(e){toast(errMsg(e),'err')}
}

/* ============ Vue : Notes ============ */
let NQ={q:'',tag:''};
function md(src){
  let h=esc(src);
  h=h.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  h=h.replace(/^### (.*)$/gm,'<h4>$1</h4>').replace(/^## (.*)$/gm,'<h3>$1</h3>').replace(/^# (.*)$/gm,'<h2>$1</h2>');
  h=h.replace(/^- \[x\] (.*)$/gim,'<div class="ck on">'+ic('check',14)+'<span>$1</span></div>').replace(/^- \[ \] (.*)$/gm,'<div class="ck"><i></i><span>$1</span></div>');
  h=h.replace(/^[-*] (.*)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,m=>'<ul>'+m.replace(/\n/g,'')+'</ul>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)([^*\n]+?)\*/g,'$1<i>$2</i>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/==(.+?)==/g,'<mark>$1</mark>');
  return h.replace(/\n/g,'<br>').replace(/(<\/(h2|h3|h4|ul|div)>)<br>/g,'$1');
}
function noteCard(n,i){return`<article class="note" style="--c:${n.color};--d:${Math.min(i,20)*30}ms" data-act="openNote" data-id="${n.id}">${n.pinned?`<span class="pinned">${ic('pin',15)}</span>`:''}<h4>${esc(n.title||'Sans titre')}</h4><div class="md">${md((n.body||'').slice(0,500))}</div><footer>${(n.tags||[]).map(t=>`<span>#${esc(t)}</span>`).join('')}<time>${fmtRel(n.updated)}</time></footer></article>`}
R.notes=()=>{
  const tags=[...new Set(S.notes.flatMap(n=>n.tags||[]))].sort((a,b)=>a.localeCompare(b,'fr'));
  if(NQ.tag&&!tags.includes(NQ.tag))NQ.tag='';
  return`<div class="toolbar card"><label class="search grow">${ic('search',16)}<input id="nq" placeholder="Rechercher dans tes notes…" value="${esc(NQ.q)}"></label><button class="btn primary" data-act="newNote">${ic('plus')}Nouvelle note</button></div>
  ${tags.length?`<div class="chips"><button class="chip ${!NQ.tag?'on':''}" data-act="ntag" data-t="">Toutes</button>${tags.map(t=>`<button class="chip ${NQ.tag===t?'on':''}" data-act="ntag" data-t="${esc(t)}">#${esc(t)}</button>`).join('')}</div>`:''}
  <div id="ngrid" class="notes-grid"></div>`;
};
AFTER.notes=()=>{drawNotes();$('#nq').addEventListener('input',e=>{NQ.q=e.target.value;drawNotes()})};
function drawNotes(){const el=$('#ngrid');if(!el)return;const q=NQ.q.toLowerCase();const l=S.notes.filter(n=>(!NQ.tag||(n.tags||[]).includes(NQ.tag))&&((n.title||'')+' '+(n.body||'')+' '+(n.tags||[]).join(' ')).toLowerCase().includes(q)).sort((a,b)=>(b.pinned-a.pinned)||(b.updated-a.updated));el.innerHTML=l.length?l.map(noteCard).join(''):empty('note',q?'Aucune note trouvée':'Pas encore de notes — crée ta première !')}
function wrapSel(ta,a,b){const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value;if(!b){const ls=v.lastIndexOf('\n',s-1)+1;ta.value=v.slice(0,ls)+a+v.slice(ls);ta.selectionStart=ta.selectionEnd=e+a.length}else{ta.value=v.slice(0,s)+a+v.slice(s,e)+b+v.slice(e);ta.selectionStart=s+a.length;ta.selectionEnd=e+a.length}ta.focus();ta.dispatchEvent(new Event('input'))}
function openNote(id){
  const n=S.notes.find(x=>x.id===id);if(!n)return;
  const TB=[['**','**','Gras'],['*','*','Italique'],['==','==','Surligner'],['# ','','Titre'],['- ','','Liste'],['- [ ] ','','Tâche'],['`','`','Code']];
  const m=modal(`<div class="ne" style="--c:${n.color}">
    <div class="ne-top"><input class="ne-title" id="neT" value="${esc(n.title)}" placeholder="Titre de la note"><button class="icon-btn ${n.pinned?'on':''}" id="nePin" title="Épingler">${ic('pin')}</button><button class="icon-btn" id="neDel" title="Supprimer">${ic('trash')}</button><button class="icon-btn" data-act="close" title="Fermer">${ic('x')}</button></div>
    <div class="ne-bar"><div class="mdbar" id="neTb">${TB.map(([a,b,l])=>`<button data-w="${esc(a)}" data-w2="${esc(b)}">${l}</button>`).join('')}</div><div class="seg"><button id="neEd" class="on">${ic('edit',14)}Écrire</button><button id="nePv">Aperçu</button></div></div>
    <textarea id="neB" class="ne-body" placeholder="Écris ici… Markdown simple : **gras**, # titre, - liste, - [ ] tâche, ==surligné==">${esc(n.body)}</textarea>
    <div id="nePrev" class="ne-body md hidden"></div>
    <div class="ne-foot"><div class="dots" id="neC">${NOTE_COLORS.map(c=>`<button class="dot ${c===n.color?'on':''}" style="--c:${c}" data-c="${c}"></button>`).join('')}</div><input class="input sm" id="neTags" placeholder="Tags séparés par des virgules (ex : maths, partiel)" value="${esc((n.tags||[]).join(', '))}"><small class="muted" id="neS">${n.updated?'Enregistré':''}</small></div>
  </div>`,'lg');
  const st=$('#neS',m),ta=$('#neB',m);
  const upd=()=>{n.updated=Date.now();if(!S.notes.includes(n))S.notes.unshift(n);save();st.textContent='Enregistré ✓'};
  $('#neT',m).addEventListener('input',e=>{n.title=e.target.value;upd()});
  ta.addEventListener('input',()=>{n.body=ta.value;upd()});
  $('#neTags',m).addEventListener('input',e=>{n.tags=[...new Set(e.target.value.split(',').map(s=>s.trim().replace(/^#/,'')).filter(Boolean))];upd()});
  $('#neC',m).onclick=e=>{const d=e.target.closest('[data-c]');if(!d)return;n.color=d.dataset.c;$('.ne',m).style.setProperty('--c',n.color);$$('#neC .dot',m).forEach(b=>b.classList.toggle('on',b===d));upd()};
  $('#nePin',m).onclick=e=>{n.pinned=!n.pinned;e.currentTarget.classList.toggle('on',n.pinned);upd();toast(n.pinned?'Note épinglée':'Note désépinglée','info')};
  $('#neTb',m).onclick=e=>{const b=e.target.closest('[data-w]');if(b){if(!$('#nePrev',m).classList.contains('hidden'))$('#neEd',m).click();wrapSel(ta,b.dataset.w,b.dataset.w2)}};
  $('#neEd',m).onclick=()=>{$('#neEd',m).classList.add('on');$('#nePv',m).classList.remove('on');ta.classList.remove('hidden');$('#nePrev',m).classList.add('hidden');ta.focus()};
  $('#nePv',m).onclick=()=>{$('#nePv',m).classList.add('on');$('#neEd',m).classList.remove('on');$('#nePrev',m).innerHTML=md(n.body)||'<span class="muted">Rien à afficher</span>';ta.classList.add('hidden');$('#nePrev',m).classList.remove('hidden')};
  ta.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='b'){e.preventDefault();wrapSel(ta,'**','**')}if((e.ctrlKey||e.metaKey)&&e.key==='i'){e.preventDefault();wrapSel(ta,'*','*')}});
  const refresh=()=>{if(route.view==='notes'||route.view==='dash')render(false)};
  $('#neDel',m).onclick=async()=>{if(!await confirmBox('Supprimer cette note ?','Cette action est définitive.','Supprimer'))return;S.notes=S.notes.filter(x=>x!==n);save();m.onClose=refresh;closeModal(m);toast('Note supprimée')};
  m.onClose=()=>{if(!(n.title||'').trim()&&!(n.body||'').trim()&&S.notes.includes(n)){S.notes=S.notes.filter(x=>x!==n);save()}refresh()};
  setTimeout(()=>(n.title?ta:$('#neT',m)).focus(),80);
}

/* ============ Vue : Agenda ============ */
const CAL={y:new Date().getFullYear(),m:new Date().getMonth(),sel:todayStr()};
R.agenda=()=>`<div id="altStats">${altStats()}</div><div class="cal-wrap"><section class="card"><div class="cal-h"><h2 id="calT"></h2><div class="row gap"><button class="icon-btn" data-act="calPrev" title="Mois précédent">${ic('left')}</button><button class="btn sm" data-act="calToday">Aujourd'hui</button><button class="icon-btn" data-act="calNext" title="Mois suivant">${ic('right')}</button><button class="btn primary sm" data-act="newEvent">${ic('plus',16)}Événement</button></div></div><div class="cal-dow"><span>Sem.</span>${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d=>`<span>${d}</span>`).join('')}</div><div class="cal-grid" id="calG"></div><div class="legend"><span><i style="--c:var(--wc)"></i>Semaine de cours</span><span><i style="--c:var(--we)"></i>Semaine en entreprise</span><span class="muted">Clique sur « S. » pour changer une semaine</span><a class="link" data-act="scrollPlan" style="margin-left:auto">Planifier mes semaines →</a></div></section><aside class="side-col"><section class="card day" id="dayP"></section>${altPlan()}</aside></div>${altOverview()}`;
AFTER.agenda=()=>{drawCal();(()=>{const g=$('#calG');let x0=null,y0=0;g.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});g.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)(dx<0?ACT.calNext:ACT.calPrev)()},{passive:true})})();$('#altT').addEventListener('change',e=>$('#altX').classList.toggle('hidden',e.target.value!=='alt'));$('#calG').addEventListener('dblclick',e=>{const c=e.target.closest('.cd');if(c)eventModal(null,c.dataset.d)})};
function drawCal(dir=0){
  const g=$('#calG');if(!g)return;
  const{y,m}=CAL;$('#calT').innerHTML=`${MONTHS[m]} <span class="muted">${y}</span>`;
  const off=(new Date(y,m,1).getDay()+6)%7,start=new Date(y,m,1-off),today=todayStr();let h='';
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=dstr(d),ev=eventsOn(s),wt=S.weeks[wkKey(d)]||'';
    if(i%7===0)h+=`<button class="wk ${wt}" data-act="cycleWeek" data-w="${s}" style="--d:${i*7}ms" title="${wt?WK[wt].l+' — cliquer pour changer':'Cliquer pour marquer cours / entreprise'}">S${isoWeek(d)}${wt?ic(WK[wt].ic,13):''}</button>`;
    h+=`<div class="cd ${wt&&d.getDay()%6!==0?'w-'+wt:''} ${d.getMonth()!==m?'out':''} ${s===today?'today':''} ${s===CAL.sel?'sel':''}" data-act="selDay" data-d="${s}" style="--d:${i*7}ms"><span class="cn">${d.getDate()}</span><div class="ce">${ev.slice(0,3).map(e=>`<i style="--c:${e.color}">${e.time?`<em>${e.time}</em> `:''}${esc(e.title)}</i>`).join('')}${ev.length>3?`<i class="more">+${ev.length-3} autre${ev.length>4?'s':''}</i>`:''}</div></div>`}
  g.innerHTML=h;
  if(dir&&S.settings.anim){g.style.animation='none';void g.offsetWidth;g.style.animation=`${dir>0?'slideL':'slideR'} .4s var(--ease)`}
  drawDay();
}
function drawDay(){
  const el=$('#dayP');if(!el)return;const s=CAL.sel,ev=eventsOn(s),d=pdate(s);
  el.innerHTML=`<div class="day-h"><div><p class="eyebrow">${DAYS[d.getDay()]}${s===todayStr()?" · aujourd'hui":''}</p><h2>${d.getDate()} ${MONTHS[d.getMonth()]}</h2>${(t=>t?`<span class="wpill" style="--c:var(--${t==='cours'?'wc':'we'});margin-top:8px">${ic(WK[t].ic,14)}Semaine ${t==='cours'?'de cours':'en entreprise'}</span>`:(d.getDay()%6?'':`<span class="wpill" style="--c:var(--muted);margin-top:8px">Week-end</span>`))(d.getDay()%6?S.weeks[wkKey(d)]:'')}</div><button class="icon-btn primary" data-act="newEvent" data-d="${s}" title="Ajouter">${ic('plus')}</button></div>
  ${ev.length?ev.map((e,i)=>`<div class="ev-card" style="--c:${e.color};--d:${i*50}ms" data-act="editEvent" data-id="${e.id}"><div class="ev-time">${e.time?e.time+(e.end?`<br><small>${e.end}</small>`:''):'Journée'}</div><div class="grow"><b>${esc(e.title)}</b>${e.cat?`<span class="tag">${esc(e.cat)}</span>`:''}${e.desc?`<p>${esc(e.desc)}</p>`:''}${e.repeat&&e.repeat!=='none'?`<small class="muted">↻ ${REP[e.repeat]}</small>`:''}</div></div>`).join(''):empty('cal','Rien de prévu ce jour-là. Double-clique sur une case pour ajouter vite un événement.')}`;
}

    <div class="row between mt">${isNew?'<span></span>':`<button type="button" class="btn danger" id="evDel">${ic('trash',16)}Supprimer</button>`}<div class="row gap"><button type="button" class="btn" data-act="close">Annuler</button><button class="btn primary">${ic('check',16)}Enregistrer</button></div></div>

    CAL.sel=e.date;const d=pdate(e.date);CAL.y=d.getFullYear();CAL.m=d.getMonth();closeModal(m);refreshEvents();toast(isNew?'Événement ajouté':'Événement modifié')};

function palette(){
  if($('.pal'))return;
  const m=modal(`<div class="pal"><label class="search">${ic('search')}<input id="palI" placeholder="Rechercher une page, une note, un événement…"></label><div id="palR" class="pal-r"></div></div>`,'md top');
  const i=$('#palI',m),out=$('#palR',m);let items=[],idx=0;
  const base=[...Object.keys(VIEWS).map(k=>({t:VIEWS[k],s:'Aller à',ic:VICON[k],run:()=>go(k)})),{t:'Nouvelle note',s:'Action',ic:'plus',run:()=>ACT.newNote()},{t:'Nouvel événement',s:'Action',ic:'plus',run:()=>ACT.newEvent()},{t:'Importer des fichiers',s:'Action',ic:'upload',run:()=>ACT.goUpload()},{t:'Changer de thème',s:'Action',ic:'sun',run:()=>ACT.toggleTheme()}];
  const paint=()=>{out.innerHTML=items.length?items.map((x,k)=>`<div class="pal-i ${k===idx?'on':''}" data-k="${k}">${ic(x.ic)}<span class="grow ellipsis">${esc(x.t)}</span><small>${esc(x.s)}</small></div>`).join(''):'<p class="muted pad">Aucun résultat</p>'};
  const draw=()=>{const q=i.value.toLowerCase().trim();
    const notes=S.notes.map(n=>({t:n.title||'Sans titre',s:'Note',ic:'note',x:(n.body||'')+' '+(n.tags||[]).join(' '),run:()=>openNote(n.id)}));
    const evs=S.events.map(e=>({t:e.title,s:'Événement · '+fmtShort(e.date),ic:'cal',x:e.cat+' '+e.desc,run:()=>{CAL.sel=e.date;const d=pdate(e.date);CAL.y=d.getFullYear();CAL.m=d.getMonth();go('agenda');setTimeout(()=>eventModal(e),80)}}));
    items=(q?[...base,...notes,...evs].filter(x=>(x.t+' '+(x.x||'')).toLowerCase().includes(q)):base).slice(0,14);idx=0;paint()};
  const run=k=>{const x=items[k];if(!x)return;closeModal(m);setTimeout(x.run,120)};
  i.addEventListener('input',draw);
  i.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){idx=Math.min(idx+1,items.length-1);paint();e.preventDefault()}else if(e.key==='ArrowUp'){idx=Math.max(idx-1,0);paint();e.preventDefault()}else if(e.key==='Enter')run(idx)});

}

const WK={cours:{l:'Cours',ic:'book'},entreprise:{l:'Entreprise',ic:'briefcase'}};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const wkKey=d=>dstr(mondayOf(d));
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)}
const wkVar=t=>t==='cours'?'var(--wc)':t==='entreprise'?'var(--we)':'var(--muted)';
const fmtD=d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
function nextChange(){const m=mondayOf(new Date()),cur=S.weeks[dstr(m)]||'';for(let i=1;i<120;i++){const d=new Date(m);d.setDate(d.getDate()+7*i);const t=S.weeks[dstr(d)]||'';if(t!==cur)return{d,t}}return null}
function weekPill(){const t=S.weeks[wkKey(new Date())];const n=isoWeek(new Date());if(!t)return`<div style="margin-top:10px"><a class="wpill" style="--c:var(--muted)" data-act="go" data-v="agenda">${ic('swap',14)}Semaine ${n} · non définie — planifier mes semaines</a></div>`;const nc=nextChange();return`<div style="margin-top:10px"><span class="wpill" style="--c:${wkVar(t)}">${ic(WK[t].ic,14)}Semaine ${n} · ${t==='cours'?'En cours':'En entreprise'}${nc&&nc.t?` · ${nc.t==='cours'?'cours':'entreprise'} dès le ${fmtD(nc.d)}`:''}</span></div>`}
function schoolYears(){const out=[];for(const y of[2026,2027]){const months=[];let m=mondayOf(new Date(y,8,1));if(m.getMonth()===7&&new Date(m.getFullYear(),m.getMonth(),m.getDate()+3).getMonth()===7)m.setDate(m.getDate()+7);
  const end=new Date(y+1,7,31);const by=new Map();while(true){const th=new Date(m);th.setDate(th.getDate()+3);if(th>end)break;const key=th.getFullYear()+'-'+th.getMonth();if(!by.has(key))by.set(key,{label:MONTHS[th.getMonth()]+' '+th.getFullYear(),weeks:[]});by.get(key).weeks.push(new Date(m));m.setDate(m.getDate()+7)}
  out.push({label:`${y}-${y+1}`,months:[...by.values()]})}return out}

/* ============ GitHub intégré (token chiffré par mot de passe) ============ */
const u8b64=u=>{let s='';for(const b of u)s+=String.fromCharCode(b);return btoa(s)};
const b64u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encToken(tok,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await deriveKey(pw,salt),new TextEncoder().encode(tok)));return{salt:u8b64(salt),iv:u8b64(iv),data:u8b64(ct)}}
async function decToken(enc,pw){return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(enc.iv)},await deriveKey(pw,b64u8(enc.salt)),b64u8(enc.data)))}
async function buildEmbedded(emb,msg){
  const line='/*'+'EMBED*/const EMBED='+JSON.stringify(emb)+';/*'+'EMBED_END*/';
  let src=null;try{const r=await fetch(location.href.split('#')[0],{cache:'no-store'});if(r.ok)src=await r.text()}catch{}
  const re=new RegExp('/\\*'+'EMBED\\*/[\\s\\S]*?/\\*'+'EMBED_END\\*/');
  if(src&&re.test(src)){saveBlob(new Blob([src.replace(re,()=>line)],{type:'text/html'}),'index.html');
    msg(`✓ Nouveau <b>index.html</b> téléchargé. Remplace l'ancien dans le dépôt de ton site sur GitHub (<b>Add file → Upload files</b>, puis <b>Commit changes</b>) : Vercel le mettra en ligne automatiquement en moins d'une minute.`,'ok')}
  else{$('#emMsg').innerHTML=`<div class="msg warn">Je n'ai pas pu relire le fichier du site (ouvert en local ?). Dans ton <b>index.html</b>, remplace la ligne qui commence par <code>/*EMBED*/</code> par celle-ci :</div><textarea class="input codebox mt" readonly>${esc(line)}</textarea>`}
}

      if(!r.private)ghMsg(`✓ Connecté à ${esc(r.full_name)}. ⚠️ Ce dépôt est <b>public</b> : tout le monde peut voir tes fichiers. Pour le passer en privé : sur GitHub, ouvre le dépôt → <b>Settings</b> → tout en bas, <b>Danger Zone</b> → <b>Change repository visibility</b> → <b>Make private</b>.`,'warn');
      toast('GitHub connecté');
    }catch(e){if(old.token)localStorage.setItem('orga_gh',JSON.stringify(old));else localStorage.removeItem('orga_gh');setStatus();ghMsg('Échec : '+esc(errMsg(e)),'err')}
  },
  cycleWeek:a=>{const k=wkKey(pdate(a.dataset.w));const n={'':'cours',cours:'entreprise',entreprise:''}[S.weeks[k]||''];if(n)S.weeks[k]=n;else delete S.weeks[k];save();refreshAlt();toast(n?`Semaine ${isoWeek(pdate(k))} : ${WK[n].l.toLowerCase()}`:`Semaine ${isoWeek(pdate(k))} : non définie`,'info')},
  fabMenu:()=>{const m=modal(`<h3>Ajouter</h3><div class="sheet">
      <button data-f="note"><span class="si">${ic('note',22)}</span><b>Nouvelle note</b></button>
      <button data-f="ev"><span class="si">${ic('cal',22)}</span><b>Événement</b></button>
      <button data-f="up"><span class="si">${ic('upload',22)}</span><b>Importer des fichiers</b></button>
      <button data-f="dir"><span class="si">${ic('folder',22)}</span><b>Nouveau dossier</b></button>
      <button data-f="wk"><span class="si">${ic('swap',22)}</span><b>Mes semaines</b></button>
      <button data-f="search"><span class="si">${ic('search',22)}</span><b>Rechercher</b></button></div>`,'sm');
    m.addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;const f=b.dataset.f;
      if(f==='up'){if(route.view!=='files')go('files');$('#inFiles').click();closeModal(m);return}
      closeModal(m);setTimeout(()=>{if(f==='note')ACT.newNote();else if(f==='ev')ACT.newEvent();else if(f==='search')palette();else if(f==='wk'){go('agenda');setTimeout(ACT.scrollPlan,450)}else if(f==='dir'){if(route.view!=='files'){go('files');setTimeout(ACT.mkdir,300)}else ACT.mkdir()}},200)})},
  unlock:()=>{sessionStorage.removeItem('orga_skip');lockScreen()},
  scrollPlan:()=>{const el=$('#altPlan');if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.animate([{boxShadow:'0 0 0 0 var(--accent)'},{boxShadow:'0 0 0 6px var(--soft)'},{boxShadow:'0 0 0 0 transparent'}],{duration:1200})}},
  altApply:()=>{const f=$('#altF');if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f));if(v.to<v.from)return toast('La date de fin est avant la date de début','err');
    let m=mondayOf(pdate(v.from)),i=0,n=0;const end=pdate(v.to),a=Math.max(1,+v.na||1),b=Math.max(1,+v.nb||1),other=v.first==='cours'?'entreprise':'cours';
    while(m<=end){let t=v.type;if(v.type==='alt')t=(i%(a+b))<a?v.first:other;const k=dstr(m);if(t==='none')delete S.weeks[k];else S.weeks[k]=t;m.setDate(m.getDate()+7);i++;n++}
    save();refreshAlt();toast(`${n} semaine${n>1?'s':''} mise${n>1?'s':''} à jour`)},
  altClearAll:async()=>{if(!await confirmBox('Effacer tout le planning ?','Toutes les semaines redeviendront « non définies ».','Effacer'))return;S.weeks={};save();refreshAlt()},
  embedGen:async()=>{const p1=$('#emP1').value,p2=$('#emP2').value,msg=(t,c)=>$('#emMsg').innerHTML=`<div class="msg ${c}">${t}</div>`;
    if(p1.length<10)return msg('Choisis un mot de passe d’au moins 10 caractères (le fichier est public sur Vercel, un mot de passe court pourrait être deviné).','err');
    if(p1!==p2)return msg('Les deux mots de passe ne correspondent pas.','err');
    msg('Chiffrement…','info');
    try{const c=GH.cfg();const emb={owner:c.owner,repo:c.repo,branch:c.branch||'main',base:c.base||'',enc:await encToken(c.token,p1)};await buildEmbedded(emb,msg)}catch(e){msg('Erreur : '+esc(e.message),'err')}},
  embedClear:async()=>{const msg=(t,c)=>$('#emMsg').innerHTML=`<div class="msg ${c}">${t}</div>`;try{await buildEmbedded({},msg)}catch(e){msg('Erreur : '+esc(e.message),'err')}},
  ghOff:async()=>{if(!await confirmBox('Déconnecter GitHub ?','Tes fichiers restent sur GitHub. Ce navigateur n’y aura simplement plus accès.','Déconnecter'))return;localStorage.removeItem('orga_gh');setStatus();render(false);toast('GitHub déconnecté','info')},
  syncNow:async()=>{await Sync.pull(true);toast('Synchronisation terminée')},
  exportData:()=>saveBlob(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),`sio-2026-2028-${todayStr()}.json`),
  importData:()=>$('#inJson').click(),
  resetData:async()=>{if(!await confirmBox('Tout effacer ?','Toutes tes notes et ton agenda seront supprimés (les réglages et fichiers sont conservés).','Effacer'))return;S.notes=[];S.events=[];S.folderMeta={};save();toast('Données effacées','info');render(false)}
};

/* ============ Démarrage ============ */
$('#nav').innerHTML=Object.keys(VIEWS).map(k=>`<a href="#/${k}" data-v="${k}" title="${VIEWS[k]}">${ic(VICON[k],20)}<span>${VIEWS[k]}</span></a>`).join('');
$('#palBtn').innerHTML=ic('search',16)+'<span>Rechercher…</span><kbd>Ctrl K</kbd>';
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||e.target.closest('a[href^="http"]'))return;const f=ACT[a.dataset.act];if(f){e.preventDefault();f(a,e)}});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palette()}
  else if(e.key==='Escape')closeModal();
  else if(!$('.modal-wrap')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){const m={'1':'dash','2':'files','3':'notes','4':'agenda','5':'settings'};if(m[e.key])go(m[e.key]);if(e.key==='n')ACT.newNote()}
});
$('#inFiles').addEventListener('change',e=>{const l=[...e.target.files].map(f=>({file:f,rel:f.name}));e.target.value='';uploadAll(l,route.view==='files'?route.path:'')});
$('#inDir').addEventListener('change',e=>{const l=[...e.target.files].map(f=>({file:f,rel:f.webkitRelativePath||f.name}));e.target.value='';uploadAll(l,route.view==='files'?route.path:'')});
$('#inJson').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=JSON.parse(await f.text());if(!await confirmBox('Importer cette sauvegarde ?','Elle remplacera tes notes, ton agenda et tes réglages actuels.','Importer'))return;S=merge(d);save();applySettings();render();toast('Sauvegarde importée')}catch{toast('Fichier de sauvegarde invalide','err')}});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>e.preventDefault());
window.addEventListener('hashchange',()=>{parseHash();render()});
matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(S.settings.theme==='auto')applySettings()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)Sync.pull()});
window.addEventListener('beforeunload',e=>{if(Sync.dirty&&GH.on()){Sync.push();e.preventDefault();e.returnValue=''}});
function touchIcon(){try{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#0b0b12';x.fillRect(0,0,180,180);x.drawImage(img,0,0,180,180);let l=$('link[rel=apple-touch-icon]');if(!l){l=document.createElement('link');l.rel='apple-touch-icon';document.head.appendChild(l)}l.href=c.toDataURL('image/png')};img.src='data:image/svg+xml;base64,'+btoa(logoSvg(180).replace('rx="18"','rx="0"'))}catch{}}
parseHash();applySettings();render();touchIcon();setStatus(GH.on()?'sync':'local');Sync.pull();
if(!GH.on()&&EMBED.enc&&!sessionStorage.getItem('orga_skip'))setTimeout(lockScreen,350);
</script>
</body>
</html>
