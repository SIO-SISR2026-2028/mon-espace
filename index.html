<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIO 26-28">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="format-detection" content="telephone=no">
<title>SIO 2026-2028</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#7c5cff;--accent2:color-mix(in srgb,var(--accent) 55%,#ff6ad5);--soft:color-mix(in srgb,var(--accent) 14%,transparent);--r:16px;--ease:cubic-bezier(.2,.8,.2,1);--side:250px;font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif}
[data-theme=dark]{--bg:#0b0b12;--bg2:#13131d;--panel:rgba(255,255,255,.04);--panel-2:rgba(255,255,255,.07);--input:rgba(255,255,255,.05);--glass:rgba(12,12,20,.55);--line:rgba(255,255,255,.08);--text:#ececf3;--muted:#8d8da6;--shadow:0 12px 40px rgba(0,0,0,.45);color-scheme:dark}
[data-theme=light]{--bg:#f3f3f9;--bg2:#ffffff;--panel:rgba(255,255,255,.72);--panel-2:#ffffff;--input:#f2f2f8;--glass:rgba(255,255,255,.6);--line:rgba(20,20,60,.09);--text:#1b1b2f;--muted:#6c6c86;--shadow:0 12px 32px rgba(40,40,90,.08);color-scheme:light}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;font-size:15px}
.theme-switch,.theme-switch *,.theme-switch *::before,.theme-switch *::after{transition:none!important;animation-play-state:paused!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--accent);cursor:pointer;text-decoration:none}
.ic{flex:none;display:block}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid transparent;background-clip:padding-box}

/* Fond animé */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.32;animation:float 22s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--accent);top:-16vmax;left:-12vmax}
.bg i:nth-child(2){background:#ff6ad5;bottom:-22vmax;right:-12vmax;animation-delay:-7s;animation-duration:27s}
.bg i:nth-child(3){background:#4cc9f0;top:35%;left:40%;width:28vmax;height:28vmax;opacity:.16;animation-duration:31s}
[data-theme=light] .bg i{opacity:.2}
@keyframes float{to{transform:translate(9vmax,6vmax) scale(1.15)}}
[data-bg=mesh] .bg i{animation:none}
[data-bg=grid] .bg i{display:none}
[data-bg=grid] .bg{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:34px 34px;-webkit-mask-image:radial-gradient(circle at 50% 25%,#000,transparent 75%);mask-image:radial-gradient(circle at 50% 25%,#000,transparent 75%)}
[data-bg=plain] .bg{display:none}
.noanim *,.noanim *::before,.noanim *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Structure */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh;transition:grid-template-columns .35s var(--ease)}
.compact{--side:82px}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);z-index:40}
.logo{display:flex;align-items:center;gap:12px;padding:6px 10px 24px;font-weight:800;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.logo svg{flex:none;filter:drop-shadow(0 6px 16px color-mix(in srgb,var(--accent) 55%,transparent));transition:transform .4s var(--ease)}
.logo:hover svg{transform:rotate(-8deg) scale(1.08)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:calc(var(--r) - 4px);color:var(--muted);font-weight:600;transition:.25s var(--ease);white-space:nowrap}
.nav a:hover{color:var(--text);background:var(--panel-2)}
.nav a.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 26px -10px var(--accent)}
.nav a.on .ic{animation:bounce .5s var(--ease)}
@keyframes bounce{40%{transform:scale(1.25) rotate(-8deg)}}
.compact .nav a span,.compact .logo span:last-child,.compact .side-foot .lbl{display:none}
.compact .nav a,.compact .logo{justify-content:center;padding-left:0;padding-right:0}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-foot .btn{justify-content:center}
main{min-width:0;padding:22px clamp(16px,3vw,38px) 70px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.03em}
.sync{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;cursor:default}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.st-ok b{background:#3ddc97;box-shadow:0 0 0 4px rgba(61,220,151,.15)}
.sync.st-sync b,.sync.st-pending b{background:#ffd166;animation:pulse 1s infinite}
.sync.st-auth{cursor:pointer;color:var(--text);border-color:color-mix(in srgb,#4c8dff 50%,var(--line))}.sync.st-auth b{background:#4c8dff;animation:pulse 1.4s infinite}
.sync.st-err b{background:#ff5d6c;box-shadow:0 0 0 4px rgba(255,93,108,.15)}
@keyframes pulse{50%{opacity:.3}}
.sbtn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--muted);min-width:220px;transition:.2s}
.sbtn:hover{border-color:var(--accent);color:var(--text)}
.sbtn kbd{margin-left:auto;font:600 11px inherit;padding:2px 7px;border-radius:6px;border:1px solid var(--line)}
#view.enter{animation:viewIn .5s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}}

/* Composants */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.mt{margin-top:18px}
.row{display:flex;align-items:center}.gap{gap:10px}.wrap{flex-wrap:wrap}.end{justify-content:flex-end}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;font-weight:700;color:var(--accent)}
.link{font-size:13px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);font-weight:600;font-size:14px;transition:.2s var(--ease);white-space:nowrap}
.btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 10px 24px -12px var(--accent)}
.btn.primary:hover{box-shadow:0 14px 30px -10px var(--accent)}
.btn.danger{color:#ff5d6c}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.5;pointer-events:none}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:var(--panel-2);border:1px solid var(--line);transition:.2s var(--ease);flex:none}
.icon-btn:hover{color:var(--accent);transform:translateY(-1px)}
.icon-btn.on,.icon-btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.input{width:100%;padding:11px 14px;border-radius:12px;background:var(--input);border:1px solid var(--line);outline:none;transition:.2s;resize:vertical;color:var(--text)}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.input.lg{font-size:18px;font-weight:700}
.input.sm{padding:8px 12px;font-size:13px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.search{flex-direction:row;align-items:center;gap:8px;padding:0 12px;border-radius:12px;background:var(--input);border:1px solid var(--line);color:var(--muted);transition:.2s}
.search input{border:0;background:none;outline:none;padding:10px 0;width:100%;color:var(--text);min-width:120px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--input);border:1px solid var(--line);gap:2px}
.seg button{padding:7px 12px;border-radius:9px;color:var(--muted);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;transition:.2s}
.seg button.on{background:var(--panel-2);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.seg.full{display:flex}.seg.full button{flex:1;justify-content:center}
.dots{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;background:var(--c);transition:.2s var(--ease);box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.dot:hover{transform:scale(1.15)}
.dot.on{box-shadow:0 0 0 3px var(--bg2),0 0 0 5px var(--c)}
.cpick{width:32px;height:32px;border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.switch{flex-direction:row;align-items:center;gap:12px;cursor:pointer;color:var(--text);font-size:14px}
.switch input{display:none}
.switch span{width:44px;height:25px;border-radius:20px;background:var(--line);position:relative;transition:.25s;flex:none}
.switch span::after{content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.3s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(19px)}
input[type=range]{accent-color:var(--accent);width:100%}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 10px;color:var(--muted);text-align:center;font-size:14px}
.empty .ic{opacity:.45}
.hidden{display:none!important}

/* Accueil */
.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:30px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 100% 0,var(--soft),transparent 60%);pointer-events:none}
.hero h1{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.03em;margin:6px 0}
.hero .row.gap{margin-top:20px;flex-wrap:wrap}
.clock{position:relative;width:150px;height:150px;flex:none;display:grid;place-items:center;text-align:center}
.clock svg{position:absolute;inset:0;transform:rotate(-90deg)}
.clock circle{fill:none;stroke-width:6}
.clock .tr{stroke:var(--line)}
.clock .pr{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.clock b{font-size:32px;font-weight:800;letter-spacing:-.03em;display:block}
.clock small{color:var(--muted);font-size:12px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:18px 0}
.stat{display:flex;gap:14px;align-items:center;cursor:pointer;transition:.3s var(--ease);animation:pop .5s var(--ease) both;animation-delay:var(--d)}
.stat:hover{transform:translateY(-4px)}
.stat .si{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--soft);color:var(--accent);flex:none}
.stat b{font-size:22px;font-weight:800;display:block;letter-spacing:-.02em}
.stat small{color:var(--muted);font-size:12.5px}
.stat p{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.ev-row{display:flex;align-items:center;gap:12px;padding:11px;border-radius:12px;cursor:pointer;transition:.2s}
.ev-row:hover{background:var(--panel-2);transform:translateX(3px)}
.ev-dot{width:6px;height:36px;border-radius:6px;background:var(--c);flex:none}
.ev-row b{display:block;font-size:14px}.ev-row small{color:var(--muted);font-size:12.5px}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);white-space:nowrap}
.mini-notes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-notes .note{margin:0;padding:14px}
.mini-notes .note .md{max-height:80px}

/* Fichiers */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;margin-bottom:16px}
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-weight:600;min-width:0}
.crumbs a{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;color:var(--text);transition:.2s}
.crumbs a:hover{background:var(--panel-2)}
.crumbs a:last-child{color:var(--accent)}
.crumbs span{color:var(--muted);display:flex}
.hint{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);font-size:13.5px;margin-bottom:16px}
.files-wrap{position:relative;min-height:280px}
.files.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.files.list{display:flex;flex-direction:column;gap:6px}
.files .empty{grid-column:1/-1}
.fc{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:.25s var(--ease);animation:pop .45s var(--ease) both;animation-delay:var(--d);min-width:0}
.fc:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:var(--shadow)}
.fc.hl{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.fi{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:var(--fc,var(--accent));background:color-mix(in srgb,var(--fc,var(--accent)) 15%,transparent);margin-bottom:14px;flex:none;transition:.3s var(--ease)}
.fc:hover .fi{transform:scale(1.07) rotate(-4deg)}
.fi.dir{--fc:#ffb547}.fi.pdf{--fc:#ff5d6c}.fi.img{--fc:#3ddc97}.fi.zip{--fc:#e8b931}.fi.doc{--fc:#4c8dff}.fi.sheet{--fc:#2ecc71}.fi.slide{--fc:#ff8a4c}.fi.vid{--fc:#ff6ad5}.fi.aud{--fc:#b388ff}.fi.code{--fc:#4cc9f0}.fi.txt{--fc:#a0a0b8}.fi.other{--fc:#8d8da6}
.emo{font-size:26px;line-height:1}
.fn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fn small{color:var(--muted);font-size:12px}
.fa{position:absolute;top:10px;right:10px;display:flex;gap:4px;opacity:0;transform:translateY(-4px);transition:.2s}
.fc:hover .fa{opacity:1;transform:none}
.fa button{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--line);color:var(--muted);transition:.2s}
.fa button:hover{color:var(--accent);transform:scale(1.08)}.fa button.danger:hover{color:#ff5d6c}
.files.list .fc{display:flex;align-items:center;gap:14px;padding:10px 14px}
.files.list .fi{width:40px;height:40px;margin:0;border-radius:11px}
.files.list .fn{flex:1;min-width:0}
.files.list .fa{position:static;opacity:1;transform:none}
@media (hover:none){.fa{opacity:1;transform:none}}
.drop-ov{position:absolute;inset:-6px;border:2px dashed var(--accent);border-radius:calc(var(--r) + 4px);background:color-mix(in srgb,var(--bg) 75%,var(--accent) 10%);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--accent);opacity:0;pointer-events:none;transition:.2s;z-index:5;min-height:240px;font-size:15px}
.drag .drop-ov{opacity:1}
.drag .drop-ov .ic{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.sk{height:132px;border-radius:var(--r);background:linear-gradient(90deg,var(--panel),var(--panel-2),var(--panel));background-size:200% 100%;animation:sh 1.2s infinite}
.files.list .sk{height:60px}
@keyframes sh{to{background-position:-200% 0}}
.errbox{grid-column:1/-1;padding:18px;border-radius:12px;background:rgba(255,93,108,.1);color:#ff5d6c;font-weight:600;font-size:14px}

/* Notes */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:7px 14px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);transition:.2s}
.chip:hover{color:var(--text)}
.chip.on{background:var(--accent);color:#fff;border-color:transparent}
.notes-grid{columns:270px;column-gap:16px}
.notes-grid .empty{column-span:all}
.note{break-inside:avoid;margin-bottom:16px;padding:18px 18px 16px 22px;border-radius:var(--r);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 15%,var(--bg2)),var(--bg2));border:1px solid color-mix(in srgb,var(--c) 28%,var(--line));cursor:pointer;position:relative;transition:.3s var(--ease);animation:pop .45s var(--ease) both;animation-delay:var(--d);display:block}
.note:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:var(--shadow)}
.note::before{content:'';position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.note h4{font-size:16px;margin-bottom:8px;padding-right:20px;letter-spacing:-.01em}
.note .md{font-size:13.5px;color:var(--muted);max-height:220px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent);line-height:1.55}
.note footer{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;font-size:12px;align-items:center}
.note footer span{color:var(--c);font-weight:700}
.note footer time{margin-left:auto;color:var(--muted)}
.pinned{position:absolute;top:14px;right:14px;color:var(--c)}
.md h2,.md h3,.md h4{color:var(--text);margin:6px 0 4px;letter-spacing:-.01em}
.md ul{padding-left:20px;margin:4px 0}
.md code{background:var(--panel-2);padding:1px 6px;border-radius:6px;font-size:.9em;font-family:ui-monospace,monospace}
.md mark{background:color-mix(in srgb,#ffd166 45%,transparent);color:inherit;padding:0 3px;border-radius:4px}
.md a{word-break:break-all}
.ck{display:flex;align-items:center;gap:8px}.ck i{width:14px;height:14px;border-radius:4px;border:2px solid var(--muted);flex:none}
.ck.on{opacity:.6;text-decoration:line-through}.ck.on .ic{color:#3ddc97}
.ne{display:flex;flex-direction:column;gap:12px;height:min(78vh,740px)}
.ne-top{display:flex;gap:8px;align-items:center}
.ne-title{flex:1;font-size:24px;font-weight:800;background:none;border:0;outline:none;letter-spacing:-.02em;min-width:0;color:var(--text)}
.ne-bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mdbar{display:flex;gap:4px;flex-wrap:wrap}
.mdbar button{padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);transition:.15s}
.mdbar button:hover{color:var(--accent);border-color:var(--accent)}
.ne-body{flex:1;width:100%;resize:none;border:1px solid var(--line);border-radius:14px;background:var(--input);padding:16px;outline:none;font-size:15px;line-height:1.7;overflow:auto;color:var(--text);transition:border-color .2s}
.ne-body:focus{border-color:color-mix(in srgb,var(--c) 70%,var(--line))}
.ne-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ne-foot .input{flex:1;min-width:180px;width:auto}
.ne .dot{width:22px;height:22px}

/* Agenda */
.cal-wrap{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}

.cd{min-height:98px;padding:7px;border-radius:12px;background:var(--panel-2);border:1px solid transparent;cursor:pointer;transition:.2s var(--ease);display:flex;flex-direction:column;gap:4px;overflow:hidden;min-width:0;animation:pop .35s var(--ease) both;animation-delay:var(--d)}

.cd.out{opacity:.38}
.cd.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.cn{font-size:13px;font-weight:700;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;flex:none}
.cd.today .cn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.ce{display:flex;flex-direction:column;gap:3px;min-width:0}
.ce i{font-style:normal;font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 20%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c)}
.ce em{font-style:normal;opacity:.7}
.ce i.more{background:none;border:0;color:var(--muted)}
@keyframes slideL{from{opacity:0;transform:translateX(34px)}}
@keyframes slideR{from{opacity:0;transform:translateX(-34px)}}
.day{position:sticky;top:20px}
.day-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.day-h h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.ev-card{display:flex;gap:14px;padding:14px;border-radius:14px;background:color-mix(in srgb,var(--c) 12%,var(--panel-2));border-left:4px solid var(--c);margin-bottom:10px;cursor:pointer;transition:.25s var(--ease);animation:pop .4s var(--ease) both;animation-delay:var(--d)}
.ev-card:hover{transform:translateX(4px)}
.ev-time{font-weight:800;font-size:13px;min-width:48px;color:var(--c)}
.ev-time small{font-weight:600;opacity:.75}
.ev-card p{font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-wrap}
.tag{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--panel);color:var(--muted);vertical-align:middle}

/* Réglages */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.set-grid .card{display:flex;flex-direction:column;gap:12px}
.span2{grid-column:span 2}
.help summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:14px}

.msg.ok{background:rgba(61,220,151,.12);color:#2bbf80}.msg.err{background:rgba(255,93,108,.12);color:#ff5d6c}.msg.warn{background:rgba(255,209,102,.15);color:#d99a00}.msg.info{background:var(--soft);color:var(--accent)}

/* Modales, toasts, palette */
.modal-wrap{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(6,6,16,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}

.zl{place-self:stretch;padding:20px;display:flex;flex-direction:column;gap:4px}
.zl div{display:flex;gap:10px;padding:8px 10px;border-radius:8px;font-size:13.5px}.zl div:nth-child(odd){background:var(--panel)}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toasts{position:fixed;top:18px;right:18px;display:flex;flex-direction:column;gap:10px;z-index:100;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);box-shadow:var(--shadow);font-size:14px;font-weight:600;animation:tin .45s var(--ease);max-width:380px;pointer-events:auto}
.toast .ic{color:#3ddc97}.toast.err .ic{color:#ff5d6c}.toast.info .ic{color:var(--accent)}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{opacity:0;transform:translateX(40px) scale(.95)}}

  signIn(){return new Promise((res,rej)=>{this.pending={res,rej};const u=this.user();this.tc.requestAccessToken({prompt:'',...(u&&u.email?{login_hint:u.email}:{})})})},
  async api(url,opt={},type='json'){

    if(!id){const r=await this.find(`name='${qs(ROOT_NAME)}' and mimeType='${FOLDER}' and 'root' in parents and trashed=false`,'files(id)');id=r.files[0]&&r.files[0].id;

  async dirId(path,create){

  async list(dir){

function errMsg(e){if(!e)return'Erreur inconnue';if(e.auth)return'Session Google expirée — reconnecte-toi';const msg=e.msg||'';

  return(m[e.status]||'')+(msg?(m[e.status]?' — ':'')+msg:'')||e.message||String(e)}

/* ============ Stockage local de secours (IndexedDB) ============ */
const IDB={
  db:null,
  open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open('orga_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'path'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('f',mode);const q=fn(t.objectStore('f'));t.oncomplete=()=>res(q?q.result:undefined);t.onerror=()=>rej(t.error)})},
  all(){return this.run('readonly',st=>st.getAll())},
  get(k){return this.run('readonly',st=>st.get(k))},
  put(r){return this.run('readwrite',st=>st.put(r))},
  del(k){return this.run('readwrite',st=>st.delete(k))}
};

/* ============ Système de fichiers unifié (Drive ou local) ============ */
const hiddenName=n=>n.startsWith('.');
const FS={
  remote(){return DRV.on()},
  async list(dir){
    if(this.remote())return(await DRV.list(dir)).filter(x=>!hiddenName(x.name));
    const all=await IDB.all(),pre=dir?dir+'/':'',map=new Map();
    for(const r of all){if(!r.path.startsWith(pre)||r.path===dir)continue;const rest=r.path.slice(pre.length),i=rest.indexOf('/');
      if(i===-1)map.set(rest,{name:rest,path:r.path,type:r.type,size:r.size||0});
      else{const n=rest.slice(0,i);if(!map.has(n))map.set(n,{name:n,path:pre+n,type:'dir',size:0})}}
    return[...map.values()];
  },
  async ensureDirs(path){const parts=path.split('/');parts.pop();let cur='';for(const x of parts){cur=join(cur,x);await IDB.put({path:cur,type:'dir',mtime:Date.now()})}},
  async mkdir(path){if(this.remote())return DRV.dirId(path,true);await this.ensureDirs(path+'/x')},
  async write(path,blob,onProg){
    if(this.remote()){const parent=await DRV.dirId(parentOf(path),true),name=path.split('/').pop();
      const ex=await DRV.find(`'${parent}' in parents and name='${qs(name)}' and mimeType!='${FOLDER}' and trashed=false`,'files(id)');
      const id=ex.files[0]&&ex.files[0].id;return DRV.upload(id,id?{}:{name,parents:[parent]},blob,onProg)}
    await this.ensureDirs(path);return IDB.put({path,type:'file',blob,size:blob.size,mtime:Date.now()});
  },
  async read(path,id){if(this.remote()){id=id||await DRV.fileId(path);if(!id)throw new Error('Fichier introuvable');return DRV.api(`files/${id}?alt=media`,{},'blob')}
    const r=await IDB.get(path);if(!r||!r.blob)throw new Error('Fichier introuvable');return r.blob},
  async remove(x){
    if(this.remote()){const id=x.id||(x.type==='dir'?await DRV.dirId(x.path,false):await DRV.fileId(x.path));if(!id)return;
      await DRV.api('files/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({trashed:true})});
      for(const k of[...DRV.dc.keys()])if(k===x.path||k.startsWith(x.path+'/'))DRV.dc.delete(k);return}
    if(x.type==='file')return IDB.del(x.path);
    const all=await IDB.all();for(const r of all)if(r.path===x.path||r.path.startsWith(x.path+'/'))await IDB.del(r.path);
  },
  async move(x,dest){
    const src=parentOf(x.path);if(src===dest)return;const np=join(dest,x.name);
    if(this.remote()){
      const to=await DRV.dirId(dest,true),from=await DRV.dirId(src,false),id=x.id||(x.type==='dir'?await DRV.dirId(x.path,false):await DRV.fileId(x.path));
      const ex=await DRV.find(`'${to}' in parents and name='${qs(x.name)}' and trashed=false`,'files(id)');if(ex.files.length)throw new Error(`« ${x.name} » existe déjà dans ce dossier`);
      await DRV.api(`files/${id}?addParents=${to}&removeParents=${from}&fields=id`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:'{}'});
      for(const k of[...DRV.dc.keys()])if(k===x.path||k.startsWith(x.path+'/'))DRV.dc.delete(k);return}
    const all=await IDB.all();if(all.some(r=>r.path===np))throw new Error(`« ${x.name} » existe déjà dans ce dossier`);
    await this.ensureDirs(np);for(const r of all)if(r.path===x.path||r.path.startsWith(x.path+'/')){await IDB.del(r.path);r.path=np+r.path.slice(x.path.length);await IDB.put(r)}
  },
  async rename(x,newName){
    if(this.remote()){await DRV.api('files/'+(x.id||await DRV.fileId(x.path)),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:newName})});return}
    const blob=await this.read(x.path);await this.write(join(parentOf(x.path),newName),blob);await this.remove(x)},
  async stats(){
    if(this.remote()){const[a,c]=await Promise.all([DRV.api('about?fields=storageQuota'),DRV.countFiles()]);return{...c,quota:a.storageQuota}}
    const all=(await IDB.all()).filter(r=>r.type==='file');return{count:all.length,size:all.reduce((t,r)=>t+(r.size||0),0)};
  }
};

/* ============ Synchronisation des données (notes, agenda, semaines…) ============ */
function mergeData(loc,rem){
  const byId=(a,b)=>{const m=new Map();for(const n of a||[])m.set(n.id,n);for(const n of b||[]){const o=m.get(n.id);if(!o||(n.updated||0)>=(o.updated||0))m.set(n.id,n)}return[...m.values()]};
  return merge({...rem,notes:byId(loc.notes,rem.notes),events:byId(loc.events,rem.events),days:{...loc.days,...rem.days},folderMeta:{...loc.folderMeta,...rem.folderMeta},fileOrder:{...loc.fileOrder,...rem.fileOrder},settings:rem.settings||loc.settings,updatedAt:Date.now()});
}
const Sync={
  t:null,fid:null,busy:false,again:false,dirty:false,NAME:'sio-data.json',
  schedule(){if(!DRV.on())return;this.dirty=true;clearTimeout(this.t);setStatus('pending');this.t=setTimeout(()=>this.push(),2000)},
  async findId(){if(this.fid)return this.fid;const r=await DRV.find(`name='${this.NAME}' and trashed=false`,'files(id)',{spaces:'appDataFolder'});this.fid=r.files[0]?r.files[0].id:null;return this.fid},
  async readRemote(){const id=await this.findId();return id?merge(await DRV.api(`files/${id}?alt=media`)):null},
  async firstMerge(){setStatus('sync');const rem=await this.readRemote();if(rem)S=mergeData(S,rem);S.updatedAt=Date.now();persistLocal();applySettings();await this.push()},
  async pull(force){
    if(!DRV.on()){setStatus('local');return}
    if(!DRV.ready()){setStatus('auth');return}
    if(!force&&(this.dirty||$('.modal-wrap'))){setStatus(this.dirty?'pending':'ok');return}
    setStatus('sync');
    try{const rem=await this.readRemote();
      if(!rem)return this.push();
      if((rem.updatedAt||0)>(S.updatedAt||0)){S=rem;persistLocal();applySettings();render(false);setStatus('ok')}
      else if((rem.updatedAt||0)<(S.updatedAt||0))this.push();
      else setStatus('ok');
    }catch(e){if(e.status===404)this.fid=null;setStatus(e.auth?'auth':'err',e)}
  },
  async push(){
    if(!DRV.on())return;
    if(!DRV.ready()){this.dirty=true;setStatus('auth');return}
    if(this.busy){this.again=true;return}
    this.busy=true;this.dirty=false;setStatus('sync');
    try{const blob=new Blob([JSON.stringify(S)],{type:'application/json'}),id=await this.findId();
      if(id)await DRV.api(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media&fields=id`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:blob});
      else this.fid=(await DRV.upload(null,{name:this.NAME,parents:['appDataFolder']},blob)).id;
      setStatus('ok');
    }catch(e){this.dirty=true;if(e.status===404)this.fid=null;setStatus(e.auth?'auth':'err',e)}
    this.busy=false;if(this.again){this.again=false;this.push()}
  }
};
function setStatus(st,e){const el=$('#sync');if(!el)return;if(!DRV.on())st='local';else if(!DRV.ready()&&st!=='err')st='auth';
  const m={local:'Local',ok:'Synchronisé',sync:'Synchronisation…',pending:'Modifié',err:'Erreur de synchro',auth:'Se reconnecter'};
  el.className='sync st-'+st;el.querySelector('span').textContent=m[st];
  el.title=st==='err'?errMsg(e):st==='local'?'Données enregistrées sur cet appareil':st==='auth'?'Session Google expirée : clique pour te reconnecter':'Sauvegardé dans ton Google Drive';
  if(st==='auth')el.dataset.act='gConnect';else delete el.dataset.act;checkGate()}
function gateMsg(t,c){const el=$('#gate .gmsg');if(el)el.innerHTML=t?`<div class="msg ${c}">${t}</div>`:''}
function showGate(){
  if($('#gate'))return;const u=DRV.user(),cid=DRV.cid();
  const g=document.createElement('div');g.id='gate';
  g.innerHTML=`<div class="gate-card"><div class="lock-logo">${logoSvg(68)}</div><h2>SIO 2026-2028</h2>
    <p class="muted">${u?'Ta session Google a expiré. Reconnecte-toi pour continuer : tes dernières modifications sont gardées sur cet appareil.':'Connecte-toi avec ton compte Google pour accéder à tes cours, tes notes et ton agenda.'}</p>
    ${cid?`<button class="btn gbtn wide" data-act="gConnect">${G_ICON}${u?'Se reconnecter':'Se connecter avec Google'}</button>`:`<input class="input" id="gcid" placeholder="ID client Google (….apps.googleusercontent.com)"><button class="btn primary wide" data-act="gSaveCid">${ic('check',16)}Enregistrer</button>`}
    ${u?`<small class="muted">${esc(u.email||'')}</small>`:''}<div class="gmsg"></div></div>`;
  document.body.appendChild(g);document.body.classList.add('gated');

async function driveConnect(){
  if(!DRV.cid()){go('settings');return toast('Ajoute d’abord ton ID client Google dans les Réglages','err')}
  if(!DRV.tcReady()){toast('Chargement de Google…','info');try{await DRV.loadGis();DRV.tcReady();toast('Google est prêt : appuie encore une fois sur le bouton','info')}catch(e){toast(errMsg(e),'err')}return}
  const first=!DRV.user();
  try{await DRV.signIn();
    const me=await DRV.api('about?fields=user(displayName,emailAddress)');const prev=DRV.user();
    if(prev&&prev.email&&prev.email!==me.user.emailAddress){localStorage.removeItem('orga_groot');localStorage.removeItem('orga_gfirst');DRV.dc.clear();Sync.fid=null;DRV.rootOk=false}
    localStorage.setItem('orga_guser',JSON.stringify({name:me.user.displayName,email:me.user.emailAddress}));
    await DRV.root();
    if(!localStorage.getItem('orga_gfirst')){await Sync.firstMerge();localStorage.setItem('orga_gfirst','1')}else await Sync.pull(true);
    toast(first?'Google Drive connecté — tout est synchronisé':'Reconnecté à Google Drive');render(false);
  }catch(e){toast(errMsg(e),'err');gateMsg(esc(errMsg(e)),'err');setStatus()}
}

const evLen=e=>e.until&&e.until>e.date?Math.round((pdate(e.until)-pdate(e.date))/864e5):0;

const FERIES={};
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;return new Date(y,mo-1,da)}
function feries(y){if(FERIES[y])return FERIES[y];const e=easter(y),add=n=>{const x=new Date(e);x.setDate(e.getDate()+n);return dstr(x)};
  return FERIES[y]={[`${y}-01-01`]:"Jour de l'An",[add(1)]:'Lundi de Pâques',[`${y}-05-01`]:'Fête du Travail',[`${y}-05-08`]:'Victoire 1945',[add(39)]:'Ascension',[add(50)]:'Lundi de Pentecôte',[`${y}-07-14`]:'Fête nationale',[`${y}-08-15`]:'Assomption',[`${y}-11-01`]:'Toussaint',[`${y}-11-11`]:'Armistice 1918',[`${y}-12-25`]:'Noël'}}

const DRAG={};
function initFileDrag(){

  list.addEventListener('contextmenu',e=>{if(e.target.closest('.fc'))e.preventDefault()});
  list.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;const card=e.target.closest('.fc');if(!card||e.target.closest('.fa'))return;
    const sx=e.clientX,sy=e.clientY;
    const mv=ev=>{if(!DRAG.on&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6)dragStart(card,ev.clientX,ev.clientY);else if(DRAG.on)dragMove(ev.clientX,ev.clientY)};
    const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);if(DRAG.on)dragEnd()};
    addEventListener('pointermove',mv);addEventListener('pointerup',up)});
  list.addEventListener('touchstart',e=>{const card=e.target.closest('.fc');if(!card||e.target.closest('.fa')||e.touches.length>1)return;
    const t=e.touches[0],sx=t.clientX,sy=t.clientY;let lx=sx,ly=sy;
    const cleanup=()=>{clearTimeout(timer);list.removeEventListener('touchmove',mv);list.removeEventListener('touchend',end);list.removeEventListener('touchcancel',end)};
    const mv=ev=>{const q=ev.touches[0];lx=q.clientX;ly=q.clientY;if(!DRAG.on){if(Math.hypot(lx-sx,ly-sy)>10)cleanup();return}ev.preventDefault();dragMove(lx,ly)};
    const end=ev=>{const was=DRAG.on;cleanup();if(was){if(ev.cancelable)ev.preventDefault();dragEnd()}};
    const timer=setTimeout(()=>dragStart(card,lx,ly),380);
    list.addEventListener('touchmove',mv,{passive:false});list.addEventListener('touchend',end);list.addEventListener('touchcancel',end)},{passive:true});
}
function dragStart(card,x,y){
  if(FILES.q){toast('Efface le filtre pour déplacer tes fichiers','info');return}
  const it=FILES.items.find(i=>i.path===card.dataset.path);if(!it)return;
  const r=card.getBoundingClientRect(),c=card.cloneNode(true),g=document.createElement('div');g.className='drag-ghost files '+(S.settings.view==='list'?'list':'grid');g.style.width=r.width+'px';c.style.height=r.height+'px';g.appendChild(c);document.body.appendChild(g);
  Object.assign(DRAG,{on:true,card,item:it,ghost:g,target:null,dx:x-r.left,dy:y-r.top,start:$$('#flist .fc').map(c=>c.dataset.path).join('|')});
  card.classList.add('dragging');document.body.classList.add('is-dragging');try{navigator.vibrate&&navigator.vibrate(12)}catch{}
  dragMove(x,y);
}
function dragMove(x,y){
  DRAG.ghost.style.transform=`translate(${x-DRAG.dx}px,${y-DRAG.dy}px) scale(1.04) rotate(-1.5deg)`;
  if(y<80)scrollBy(0,-14);else if(y>innerHeight-110)scrollBy(0,14);
  $$('.drop-into').forEach(c=>c.classList.remove('drop-into'));DRAG.target=null;
  const el=document.elementFromPoint(x,y);if(!el)return;const own=DRAG.item.path;
  const crumb=el.closest('.crumbs a[data-act=cd]');
  if(crumb){const d=crumb.dataset.p;if(d!==route.path&&!(d+'/').startsWith(own+'/')){crumb.classList.add('drop-into');DRAG.target={dir:d}}return}
  const c=el.closest('#flist .fc');if(!c||c===DRAG.card)return;
  const r=c.getBoundingClientRect(),isList=S.settings.view==='list',rx=(x-r.left)/r.width,ry=(y-r.top)/r.height;
  if(c.dataset.type==='dir'&&(isList?(ry>.25&&ry<.75&&rx>.08):(rx>.18&&rx<.82&&ry>.12&&ry<.88))&&!(c.dataset.path+'/').startsWith(own+'/')){c.classList.add('drop-into');DRAG.target={dir:c.dataset.path};return}
  const before=isList?ry<.5:rx<.5,ref=before?c:c.nextSibling;
  if(ref!==DRAG.card&&ref!==DRAG.card.nextSibling)c.parentNode.insertBefore(DRAG.card,ref);
}
async function dragEnd(){

  document.body.classList.remove('is-dragging');$$('.drop-into').forEach(c=>c.classList.remove('drop-into'));if(ghost)ghost.remove();if(card)card.classList.remove('dragging');FILES.noClick=Date.now();

  const paths=$$('#flist .fc').map(c=>c.dataset.path);if(paths.join('|')===start)return;

function drawFiles(){const el=$('#flist');if(!el)return;const sb=$('#sortAZ');if(sb)sb.classList.toggle('hidden',!(S.fileOrder[route.path]||[]).length);const q=FILES.q.toLowerCase(),it=FILES.items.filter(x=>x.name.toLowerCase().includes(q));el.className='files '+S.settings.view;el.innerHTML=it.length?it.map(fileCard).join(''):empty('folder',q?'Aucun résultat':'Ce dossier est vide — dépose des fichiers ici ou clique sur « Importer »')}
async function entriesFromDrop(dt){
  const roots=[...(dt.items||[])].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  const files=[...dt.files];
  if(!roots.length)return files.map(f=>({file:f,rel:f.name}));
  const out=[];
  const walk=async(en,pre)=>{if(en.isFile){const f=await new Promise((res,rej)=>en.file(res,rej));out.push({file:f,rel:pre+f.name})}else if(en.isDirectory){const rd=en.createReader();let b;do{b=await new Promise((res,rej)=>rd.readEntries(res,rej));for(const x of b)await walk(x,pre+en.name+'/')}while(b.length)}};
  for(const r of roots)await walk(r,'');
  return out;
}

/* ============ Alternance : semaines de cours / entreprise ============ */
const WK={cours:{l:'Cours',ic:'book'},entreprise:{l:'Entreprise',ic:'briefcase'}};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const wkKey=d=>dstr(mondayOf(d));
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)}
const wkVar=t=>t==='cours'?'var(--wc)':t==='entreprise'?'var(--we)':'var(--muted)';
const fmtD=d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const isWE=d=>d.getDay()%6===0;
function dayType(d){if(typeof d==='string')d=pdate(d);if(isWE(d)||ferie(d))return'';return S.days[dstr(d)]||''}
function weekDays(mon){const a=[];for(let i=0;i<5;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);a.push(x)}return a}
function weekCounts(mon){const t=weekDays(mon).map(dayType);return{c:t.filter(x=>x==='cours').length,e:t.filter(x=>x==='entreprise').length}}
function weekType(mon){const{c,e}=weekCounts(mon);return c&&e?'mixte':c?'cours':e?'entreprise':''}
function nextChange(){const d=new Date();d.setHours(0,0,0,0);let cur=dayType(d);if(isWE(d)||ferie(d))cur=null;
  for(let i=1;i<400;i++){const x=new Date(d);x.setDate(d.getDate()+i);if(isWE(x)||ferie(x))continue;const t=dayType(x);if(cur===null){cur=t;continue}if(t!==cur)return{d:x,t,days:i}}return null}
const fmtDay=d=>d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'});
const ncText=nc=>nc?`${nc.t==='cours'?'en cours':nc.t==='entreprise'?'en entreprise':'rien de prévu'} à partir du ${fmtDay(nc.d)}`:'';
function weekPill(){const now=new Date(),n=isoWeek(now),wt=weekType(mondayOf(now)),td=dayType(now),nc=nextChange();
  if(!wt)return`<div style="margin-top:10px"><a class="wpill" style="--c:var(--muted)" data-act="go" data-v="agenda">${ic('swap',14)}Semaine ${n} · non définie — planifier mes semaines</a></div>`;
  const t=td||(wt==='mixte'?'':wt),label=td?(td==='cours'?"Aujourd'hui : en cours":"Aujourd'hui : en entreprise"):wt==='mixte'?'Semaine mixte':wt==='cours'?'Semaine de cours':'Semaine en entreprise';
  return`<div style="margin-top:10px"><span class="wpill" style="--c:${wkVar(t)}">${ic(t?WK[t].ic:'swap',14)}S${n} · ${label}${nc?' · '+ncText(nc):''}</span></div>`}
function schoolYears(){const out=[];for(const y of[2026,2027]){let m=mondayOf(new Date(y,8,1));if(m.getMonth()===7&&new Date(m.getFullYear(),m.getMonth(),m.getDate()+3).getMonth()===7)m.setDate(m.getDate()+7);
  const end=new Date(y+1,7,31);const by=new Map();while(true){const th=new Date(m);th.setDate(th.getDate()+3);if(th>end)break;const key=th.getFullYear()+'-'+th.getMonth();if(!by.has(key))by.set(key,{label:MONTHS[th.getMonth()]+' '+th.getFullYear(),weeks:[]});by.get(key).weeks.push(new Date(m));m.setDate(m.getDate()+7)}
  out.push({label:`${y}-${y+1}`,months:[...by.values()]})}return out}
function altStats(){
  const now=new Date(),mon=mondayOf(now),fri=new Date(mon);fri.setDate(mon.getDate()+4);
  const wt=weekType(mon),cnt=weekCounts(mon),td=dayType(now),nc=nextChange();
  const all=Object.entries(S.days).filter(([k])=>dayType(k)),nC=all.filter(x=>x[1]==='cours').length,nE=all.filter(x=>x[1]==='entreprise').length;
  const col=wt==='mixte'?wkVar(td||'cours'):wkVar(wt);
  const title=wt==='cours'?'📚 En cours':wt==='entreprise'?'💼 En entreprise':wt==='mixte'?'🔀 Semaine mixte':'Non définie';
  const sub=(wt==='mixte'?`${cnt.c} j de cours · ${cnt.e} j en entreprise`:`du lundi ${fmtD(mon)} au vendredi ${fmtD(fri)}`)+(nc?' · '+ncText(nc):'');
  return`<div class="alt-hero">
    <section class="card alt-now" style="--c:${col}"><p class="eyebrow">Cette semaine · S${isoWeek(now)}</p><h2>${title}</h2><small class="muted">${sub}</small></section>
    <section class="card stat" style="--c:var(--wc)"><div class="si" style="background:color-mix(in srgb,var(--wc) 16%,transparent);color:var(--wc)">${ic('book',22)}</div><div><p>Jours de cours</p><b class="big">${nC}</b></div></section>
    <section class="card stat" style="--c:var(--we)"><div class="si" style="background:color-mix(in srgb,var(--we) 16%,transparent);color:var(--we)">${ic('briefcase',22)}</div><div><p>Jours en entreprise</p><b class="big">${nE}</b></div></section>
    <section class="card stat"><div class="si">${ic('cal',22)}</div><div><p>Avant le changement</p><b class="big">${nc?nc.days:'—'}</b><small>jour${nc&&nc.days>1?'s':''}</small></div></section>
  </div>`}
function altPlan(){const now=new Date();return`<section class="card" id="altPlan"><h3>${ic('plus')} Planifier mes jours</h3>
      <form id="altF" class="form" onsubmit="return false">
        <div class="grid2"><label>Du<input class="input" type="date" name="from" value="${todayStr()}" required></label><label>Au (inclus)<input class="input" type="date" name="to" value="${todayStr()}" required></label></div>
        <div><span class="flabel">Type</span><div class="choice" id="altT">
          <label style="--c:var(--wc)"><input type="radio" name="type" value="cours" checked><span>${ic('book',18)}<b>Cours</b></span></label>
          <label style="--c:var(--we)"><input type="radio" name="type" value="entreprise"><span>${ic('briefcase',18)}<b>Entreprise</b></span></label>
          <label style="--c:var(--accent)"><input type="radio" name="type" value="alt"><span>${ic('swap',18)}<b>Alternance auto</b></span></label>
          <label style="--c:#ff5d6c"><input type="radio" name="type" value="none"><span>${ic('trash',18)}<b>Effacer</b></span></label>
        </div></div>
        <div id="altX" class="hidden" style="display:flex;flex-direction:column;gap:12px">
          <div><span class="flabel">Commencer par</span><div class="choice two">
            <label style="--c:var(--wc)"><input type="radio" name="first" value="cours" checked><span>${ic('book',18)}<b>Cours</b></span></label>
            <label style="--c:var(--we)"><input type="radio" name="first" value="entreprise"><span>${ic('briefcase',18)}<b>Entreprise</b></span></label>
          </div></div>
          <div class="grid2"><label>Nb de semaines (1er type)<input class="input" type="number" min="1" max="20" name="na" value="2"></label><label>Nb de semaines (2e type)<input class="input" type="number" min="1" max="20" name="nb" value="2"></label></div>
        </div>
        <button class="btn primary" data-act="altApply" style="justify-content:center">${ic('check',16)}Appliquer</button>
      </form>
      <p class="muted mt" style="font-size:13px">Seuls les jours que tu choisis sont marqués (du lundi au vendredi, hors fériés). Exemple pour 2 jours : du mardi 3 au mercredi 4. Tu peux aussi cliquer sur un jour du calendrier et choisir « En cours » ou « En entreprise ».</p>
      <button class="btn sm danger mt" data-act="altClearAll">${ic('trash',15)}Effacer tout le planning</button>
    </section>`}
let YOPEN={};
function altOverview(){const k=wkKey(new Date()),years=schoolYears();return`<section class="card mt" id="altOv">
      <div class="card-h"><h3>${ic('cal')} Vue d'ensemble de l'alternance</h3><div class="legend" style="margin:0"><span><i style="--c:var(--wc)"></i>Cours</span><span><i style="--c:var(--we)"></i>Entreprise</span><span><i class="mx"></i>Mixte</span></div></div>
      ${years.map((y,yi)=>{let c=0,e=0;for(const mo of y.months)for(const w of mo.weeks){const x=weekCounts(w);c+=x.c;e+=x.e}
        const yy=+y.label.slice(0,4),cur=new Date()>=new Date(yy,8,1)&&new Date()<new Date(yy+1,8,1),op=y.label in YOPEN?YOPEN[y.label]:(cur||(yi===0&&!years.some(z=>{const a=+z.label.slice(0,4);return new Date()>=new Date(a,8,1)&&new Date()<new Date(a+1,8,1)})));
        return`<details class="year" data-y="${y.label}" ${op?'open':''} ontoggle="YOPEN[this.dataset.y]=this.open"><summary><h4><span>${ic('right',16)}Année ${y.label}</span><small class="muted">${c} j cours · ${e} j entreprise</small></h4></summary><div class="months">${y.months.map(mo=>`<div class="mo"><b>${mo.label}</b><div>${mo.weeks.map(d=>{const s=dstr(d),tt=weekType(d),x=weekCounts(d),e2=new Date(d);e2.setDate(e2.getDate()+4);return`<button class="wc ${tt} ${s===k?'now':''}" data-act="cycleWeek" data-w="${s}" title="Semaine ${isoWeek(d)} : ${fmtD(d)} → ${fmtD(e2)}${tt?` · ${x.c} j cours, ${x.e} j entreprise`:''}">${d.getDate()}–${e2.getDate()}</button>`}).join('')}</div></div>`).join('')}</div></details>`}).join('')}
    </section>`}
function refreshAlt(){if(route.view!=='agenda')return render(false);drawCal();const a=$('#altStats'),o=$('#altOv');if(a)a.innerHTML=altStats();if(o)o.outerHTML=altOverview()}

/* Changement de thème : instantané sur mobile, fondu léger sur ordinateur */
function switchLook(fn){
  const root=document.documentElement;
  const run=()=>{root.classList.add('theme-switch');fn();requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.remove('theme-switch')))};
  if(!touchDevice()&&S.settings.anim&&document.startViewTransition)document.startViewTransition(run);else run();
}
/* ============ Actions ============ */
const ACT={
  go:a=>go(a.dataset.v),
  close:a=>closeModal(a.closest('.modal-wrap')),
  palette,
  cd:a=>{FILES.q='';go('files',a.dataset.p)},
  view:a=>{S.settings.view=a.dataset.m;save();$$('[data-act=view]').forEach(b=>b.classList.toggle('on',b===a));drawFiles()},
  pickFiles:()=>$('#inFiles').click(),
  pickDir:()=>$('#inDir').click(),
  goUpload:()=>{if(route.view!=='files')go('files');$('#inFiles').click()},
  mkdir:async()=>{const n=await ask('Nouveau dossier',{placeholder:'ex : Mathématiques',ok:'Créer'});if(!n)return;if(/[\/\\]/.test(n)||hiddenName(n))return toast('Nom invalide (pas de / ni de point au début)','err');try{await FS.mkdir(join(route.path,n));toast('Dossier créé');loadFiles()}catch(e){toast(errMsg(e),'err')}},
  open:a=>{const x=entry(a);if(x)preview(x)},
  dl:async a=>{const x=entry(a);if(x.gmime){const t=ftypeX(x);if(t.linkOnly)return previewGoogle(x);toast('Téléchargement…','info');try{saveBlob(await DRV.exportFile(x.id,t.exp),x.name.replace(/\.[a-z0-9]{2,5}$/i,'')+'.'+t.ext)}catch(e){toast(errMsg(e),'err')}return}toast('Téléchargement…','info');try{saveBlob(await FS.read(x.path,x.id),x.name)}catch(e){toast(errMsg(e),'err')}},
  sortAZ:()=>{delete S.fileOrder[route.path];save();FILES.items=sortItems(FILES.items,route.path);drawFiles();toast('Tri alphabétique rétabli','info')},
  rename:async a=>{const x=entry(a);const n=await ask('Renommer',{value:x.name,ok:'Renommer'});if(!n||n===x.name)return;if(/[\/\\]/.test(n))return toast('Nom invalide','err');try{toast('Renommage…','info');await FS.rename(x,n);const od=S.fileOrder[parentOf(x.path)];if(od&&od.includes(x.name)){od[od.indexOf(x.name)]=n;save()}toast('Fichier renommé');loadFiles()}catch(e){toast(errMsg(e),'err')}},
  rm:async a=>{const x=entry(a);if(!await confirmBox(`Supprimer « ${x.name} » ?`,FS.remote()?`${x.type==='dir'?'Le dossier et tout son contenu iront':'Il ira'} dans la corbeille de ton Google Drive (récupérable pendant 30 jours).`:x.type==='dir'?'Le dossier et tout son contenu seront supprimés définitivement.':'Cette action est définitive.','Supprimer'))return;
    try{await FS.remove(x);
      if(S.folderMeta[x.path]){delete S.folderMeta[x.path];save()}toast('Supprimé');loadFiles()}catch(e){toast(errMsg(e),'err')}},
  unzip:a=>unzip(entry(a)),
  customDir:a=>customDir(entry(a)),
  newNote:()=>{const n={id:uid(),title:'',body:'',color:NOTE_COLORS[0],tags:[],pinned:false,created:Date.now(),updated:0};S.notes.unshift(n);openNote(n.id)},
  openNote:a=>openNote(a.dataset.id),
  ntag:a=>{NQ.tag=a.dataset.t;$$('.chip').forEach(c=>c.classList.toggle('on',c===a));drawNotes()},
  quickSave:()=>{const t=$('#quick');const v=t.value.trim();if(!v)return;const[first,...rest]=v.split('\n');S.notes.unshift({id:uid(),title:first.slice(0,90),body:convertMd(rest.join('\n').trim()),fmt:'html',color:NOTE_COLORS[0],tags:[],pinned:false,created:Date.now(),updated:Date.now()});save();t.value='';toast('Note enregistrée');render(false)},
  newEvent:a=>eventModal(null,a&&a.dataset?a.dataset.d:undefined),
  editEvent:a=>{const e=S.events.find(x=>x.id===a.dataset.id);if(e)eventModal(e)},
  selDay:a=>{const s=a.dataset.d;CAL.sel=s;const d=pdate(s);
    if(d.getMonth()!==CAL.m){const dir=d>new Date(CAL.y,CAL.m,1)?1:-1;CAL.y=d.getFullYear();CAL.m=d.getMonth();drawCal(dir)}
    else{$$('.cd.sel').forEach(x=>x.classList.remove('sel'));a.classList.add('sel');drawDay()}
    if(innerWidth<1150)$('#dayP').scrollIntoView({behavior:'smooth',block:'start'})},
  calPrev:()=>{if(--CAL.m<0){CAL.m=11;CAL.y--}drawCal(-1)},
  calNext:()=>{if(++CAL.m>11){CAL.m=0;CAL.y++}drawCal(1)},
  calToday:()=>{const d=new Date();CAL.y=d.getFullYear();CAL.m=d.getMonth();CAL.sel=todayStr();drawCal()},
  setv:a=>{if(a.dataset.k==='theme'||a.dataset.k==='bg')return switchLook(()=>{S.settings[a.dataset.k]=a.dataset.v;applySettings();save();render(false)});S.settings[a.dataset.k]=a.dataset.v;applySettings();save();render(false)},
  toggleTheme:()=>switchLook(()=>{S.settings.theme=currentTheme()==='dark'?'light':'dark';applySettings();save();if(route.view==='settings')render(false)}),
  toggleSide:()=>{S.settings.compact=!S.settings.compact;applySettings();save();if(route.view==='settings')render(false)},
  cycleWeek:a=>{const mon=mondayOf(pdate(a.dataset.w)),n={'':'cours',cours:'entreprise',entreprise:'',mixte:'cours'}[weekType(mon)];for(const d of weekDays(mon)){const k=dstr(d);if(n)S.days[k]=n;else delete S.days[k]}save();refreshAlt();toast(`Semaine ${isoWeek(mon)} : ${n?WK[n].l.toLowerCase():'non définie'}`,'info')},
  setDay:a=>{const k=a.dataset.d,t=a.dataset.t;if(t)S.days[k]=t;else delete S.days[k];save();refreshAlt()},
  goDay:a=>{const s2=a.dataset.d,d=pdate(s2);CAL.sel=s2;CAL.y=d.getFullYear();CAL.m=d.getMonth();go('agenda')},
  fabMenu:()=>{const m=modal(`<h3>Ajouter</h3><div class="sheet">
      <button data-f="note"><span class="si">${ic('note',22)}</span><b>Nouvelle note</b></button>
      <button data-f="ev"><span class="si">${ic('cal',22)}</span><b>Événement</b></button>
      <button data-f="up"><span class="si">${ic('upload',22)}</span><b>Importer des fichiers</b></button>
      <button data-f="dir"><span class="si">${ic('folder',22)}</span><b>Nouveau dossier</b></button>
      <button data-f="wk"><span class="si">${ic('swap',22)}</span><b>Mes semaines</b></button>
      <button data-f="search"><span class="si">${ic('search',22)}</span><b>Rechercher</b></button></div>`,'sm');
    m.addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;const f=b.dataset.f;
      if(f==='up'){if(route.view!=='files')go('files');$('#inFiles').click();closeModal(m);return}
      closeModal(m);setTimeout(()=>{if(f==='note')ACT.newNote();else if(f==='ev')ACT.newEvent();else if(f==='search')palette();else if(f==='wk'){go('agenda');setTimeout(ACT.scrollPlan,450)}else if(f==='dir'){if(route.view!=='files'){go('files');setTimeout(ACT.mkdir,300)}else ACT.mkdir()}},200)})},
  scrollPlan:()=>{const el=$('#altPlan');if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.animate([{boxShadow:'0 0 0 0 var(--accent)'},{boxShadow:'0 0 0 6px var(--soft)'},{boxShadow:'0 0 0 0 transparent'}],{duration:1200})}},
  altApply:()=>{const f=$('#altF');if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f));if(v.to<v.from)return toast('La date de fin est avant la date de début','err');
    const from=pdate(v.from),to=pdate(v.to);let n=0;
    if(v.type==='alt'){const a=Math.max(1,+v.na||1),b=Math.max(1,+v.nb||1),other=v.first==='cours'?'entreprise':'cours';let m=mondayOf(from),i=0;
      while(m<=to){const t=(i%(a+b))<a?v.first:other;for(const d of weekDays(m)){if(d<from||d>to)continue;S.days[dstr(d)]=t;n++}m.setDate(m.getDate()+7);i++}}
    else for(const d=new Date(from);d<=to;d.setDate(d.getDate()+1)){if(isWE(d))continue;const k=dstr(d);if(v.type==='none')delete S.days[k];else S.days[k]=v.type;n++}
    save();refreshAlt();toast(`${n} jour${n>1?'s':''} mis à jour`)},
  altClearAll:async()=>{if(!await confirmBox('Effacer tout le planning ?','Tous les jours redeviendront « non définis ».','Effacer'))return;S.days={};S.weeks={};save();refreshAlt()},
  gConnect:()=>{driveConnect()},
  gSaveCid:()=>{const v=$('#gcid').value.trim();if(!/^[\w-]+\.apps\.googleusercontent\.com$/.test(v))return gMsg('Ce n’est pas un ID client Google valide (il se termine par .apps.googleusercontent.com).','err');localStorage.setItem('orga_gcid',v);DRV.tc=null;DRV.loadGis().then(()=>DRV.tcReady()).catch(()=>{});render(false);toast('ID client enregistré');const g=$('#gate');if(g){g.remove();document.body.classList.remove('gated');checkGate()}},
  gOff:async()=>{if(!await confirmBox('Se déconnecter de Google Drive ?','Tes cours et tes données restent dans ton Google Drive. Cet appareil n’y aura simplement plus accès.','Se déconnecter'))return;
    const t=DRV.tok();try{if(t&&window.google)google.accounts.oauth2.revoke(t,()=>{})}catch{}
    ['orga_gtok','orga_guser','orga_groot','orga_gfirst'].forEach(k=>localStorage.removeItem(k));DRV.dc.clear();DRV.rootOk=false;Sync.fid=null;setStatus();render(false);toast('Déconnecté de Google Drive','info')},
  openDrive:async()=>{const w=window.open('','_blank');try{const id=await DRV.root();if(w)w.location='https://drive.google.com/drive/folders/'+id;else location.href='https://drive.google.com/drive/folders/'+id}catch(e){if(w)w.close();toast(errMsg(e),'err')}},
  migrate:async()=>{if(!DRV.ready())return driveConnect();const a=(await IDB.all()).filter(r=>r.type==='file'&&r.blob);if(!a.length)return;UP.open(a.length);let ok=0;
    for(let i=0;i<a.length;i++){UP.step(i,a.length,a[i].path);try{await FS.write(a[i].path,a[i].blob,f=>UP.prog(i,a.length,f));await IDB.del(a[i].path);ok++}catch(e){toast(errMsg(e),'err');if(e.auth)break}}
    if(!(await IDB.all()).some(r=>r.type==='file'))for(const r of await IDB.all())await IDB.del(r.path);
    UP.done(`${ok} fichier${ok>1?'s':''} transféré${ok>1?'s':''} vers Google Drive`);render(false)},
  syncNow:async()=>{await Sync.pull(true);if($('#sync').classList.contains('st-ok'))toast('Synchronisation terminée')},
  exportData:()=>saveBlob(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),`sio-2026-2028-${todayStr()}.json`),
  importData:()=>$('#inJson').click(),
  resetData:async()=>{if(!await confirmBox('Tout effacer ?','Toutes tes notes et ton agenda seront supprimés (les réglages et fichiers sont conservés).','Effacer'))return;S.notes=[];S.events=[];S.folderMeta={};save();toast('Données effacées','info');render(false)}
};

/* ============ Démarrage ============ */
$('#nav').innerHTML=Object.keys(VIEWS).map(k=>`<a href="#/${k}" data-v="${k}" title="${VIEWS[k]}">${ic(VICON[k],20)}<span>${VIEWS[k]}</span></a>`).join('');
$('#palBtn').innerHTML=ic('search',16)+'<span>Rechercher…</span><kbd>Ctrl K</kbd>';
document.addEventListener('click',e=>{if(document.body.classList.contains('gated')&&!e.target.closest('#gate'))return;if(FILES.noClick&&Date.now()-FILES.noClick<450&&e.target.closest('#flist,.crumbs'))return;const a=e.target.closest('[data-act]');if(!a||e.target.closest('a[href^="http"]'))return;const f=ACT[a.dataset.act];if(f){e.preventDefault();f(a,e)}});
document.addEventListener('keydown',e=>{
  if(document.body.classList.contains('gated'))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palette()}
  else if(e.key==='Escape')closeModal();
  else if(!$('.modal-wrap')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){const m={'1':'dash','2':'files','3':'notes','4':'agenda','5':'settings'};if(m[e.key])go(m[e.key]);if(e.key==='n')ACT.newNote()}
});
$('#inFiles').addEventListener('change',e=>{const l=[...e.target.files].map(f=>({file:f,rel:f.name}));e.target.value='';uploadAll(l,route.view==='files'?route.path:'')});
$('#inDir').addEventListener('change',e=>{const l=[...e.target.files].map(f=>({file:f,rel:f.webkitRelativePath||f.name}));e.target.value='';uploadAll(l,route.view==='files'?route.path:'')});
$('#inJson').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=JSON.parse(await f.text());if(!await confirmBox('Importer cette sauvegarde ?','Elle remplacera tes notes, ton agenda et tes réglages actuels.','Importer'))return;S=merge(d);save();applySettings();render();toast('Sauvegarde importée')}catch{toast('Fichier de sauvegarde invalide','err')}});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>e.preventDefault());
window.addEventListener('hashchange',()=>{parseHash();render()});
matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(S.settings.theme==='auto')applySettings()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)Sync.pull()});
window.addEventListener('beforeunload',e=>{if(Sync.dirty&&DRV.ready()){Sync.push();e.preventDefault();e.returnValue=''}});
function touchIcon(){try{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#0b0b12';x.fillRect(0,0,180,180);x.drawImage(img,0,0,180,180);let l=$('link[rel=apple-touch-icon]');if(!l){l=document.createElement('link');l.rel='apple-touch-icon';document.head.appendChild(l)}l.href=c.toDataURL('image/png')};img.src='data:image/svg+xml;base64,'+btoa(logoSvg(180).replace('rx="18"','rx="0"'))}catch{}}
try{localStorage.removeItem('orga_gh');sessionStorage.removeItem('orga_skip')}catch{}
parseHash();applySettings();render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('/sw.js').catch(()=>{});setStatus(DRV.ready()?'sync':'local');Sync.pull();
if(DRV.cid())DRV.loadGis().then(()=>DRV.tcReady()).catch(()=>{});
setInterval(()=>{if(DRV.on()&&!DRV.ready()&&!$('#sync').classList.contains('st-auth'))setStatus('auth')},30000);
</script>
